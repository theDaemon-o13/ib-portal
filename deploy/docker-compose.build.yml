# Сборка образов релиза на машине разработчика (используется make-release.sh):
#   VERSION=0.1.0 docker compose -f docker-compose.yml -f docker-compose.build.yml build
# Образы собираются строго под сервер: linux/amd64.
services:
  db:
    build: { context: ../db, platforms: [linux/amd64] }
    platform: linux/amd64
  backend:
    build: { context: ../backend, platforms: [linux/amd64] }
    platform: linux/amd64
  frontend:
    build: { context: ../frontend, platforms: [linux/amd64] }
    platform: linux/amd64
