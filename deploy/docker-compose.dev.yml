# Dev-окружение: отдельный проект ibportal-dev со своими томами (CLAUDE.md, раздел 3.8).
# Тома создаются один раз вручную и не удаляются даже `down -v`:
#   docker volume create ibportal_dev_pgdata && docker volume create ibportal_dev_files
# Запуск (из каталога deploy):
#   docker compose -f docker-compose.dev.yml --env-file .env.dev up -d
name: ibportal-dev

x-backend-dev: &backend-dev
  build: { context: ../backend, target: dev }
  image: ibportal-backend:dev
  volumes:
    - ../backend:/app
    - /app/node_modules             # зависимости из образа (собраны под Linux), не с хоста

services:
  db:
    build: ../db
    image: ibportal-db:dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ibportal_dev
      POSTGRES_USER: ${DB_OWNER_USER}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Docker не публикует порты контейнера, у которого только internal-сети:
    # dbhost нужна лишь для 127.0.0.1:5433 (psql, DBeaver, npm run test:db с хоста). Только в dev.
    networks: [back, dbhost]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ibportal_dev"]
      interval: 5s
      retries: 10

  backend:
    <<: *backend-dev
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma generate >/dev/null && npm run dev"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_APP_USER}:${DB_APP_PASSWORD}@db:5432/ibportal_dev
      FILES_DIR: /data/files
      SESSION_SECRET: ${SESSION_SECRET}
      # Часовой пояс «сегодня» для сроков и автоматизаций; интервал проверки правил, 0 — выключено
      APP_TZ: ${APP_TZ:-Asia/Dushanbe}
      AUTOMATION_INTERVAL_MIN: ${AUTOMATION_INTERVAL_MIN:-60}
      # Vite dev-сервера (постоянный адрес в сети front); он передаёт адрес браузера в X-Forwarded-For.
      TRUSTED_PROXY_IPS: 172.31.251.6
      # В dev браузер виден с адреса шлюза сети front: 172.31.251.1. Пусто — вход монитора запрещён.
      MONITOR_ALLOWED_IPS: ${MONITOR_ALLOWED_IPS:-}
      # Рабочие места администраторов (ADR-0015). Пусто — без ограничения; в dev браузер виден как 172.31.251.1.
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}
      LOG_LEVEL: debug
    volumes:
      - ../backend:/app
      - /app/node_modules
      - files:/data/files
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db: { condition: service_healthy }
    networks: [back, front]

  frontend:
    build: { context: ../frontend, target: dev }
    image: ibportal-frontend:dev
    # Vite падает, если файл подменяют во время чтения (например, sed -i); пусть поднимается сам.
    restart: unless-stopped
    environment:
      VITE_HOST: 0.0.0.0
      VITE_BACKEND_URL: http://backend:3000
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [backend]
    networks:
      front: { ipv4_address: 172.31.251.6 }

  # Миграции и seed от владельца схемы:
  #   docker compose -f docker-compose.dev.yml --env-file .env.dev --profile tools run --rm migrate
  # Новая миграция (только создать файл, без применения):
  #   ... run --rm migrate npx prisma migrate dev --create-only --name <что_меняем>
  migrate:
    <<: *backend-dev
    profiles: [tools]
    # prisma generate: клиент в образе собран по схеме на момент сборки, а схема монтируется с хоста.
    command: ["sh", "-c", "npx prisma generate >/dev/null && npx prisma migrate deploy && npm run seed"]
    environment:
      DATABASE_URL: postgresql://${DB_OWNER_USER}:${DB_OWNER_PASSWORD}@db:5432/ibportal_dev
    depends_on:
      db: { condition: service_healthy }
    networks: [back]

volumes:
  pgdata: { external: true, name: ibportal_dev_pgdata }
  files:  { external: true, name: ibportal_dev_files }

networks:
  # Своя подсеть, не пересекается с серверной (172.31.250.0/29): адрес Vite постоянный (TRUSTED_PROXY_IPS).
  front:
    ipam:
      config:
        - subnet: 172.31.251.0/29
  # Не пересекается с серверными front (172.31.250.0/29) и back (172.31.249.0/24).
  back:
    internal: true
    ipam:
      config:
        - subnet: ${BACK_SUBNET:-172.31.252.0/24}
  dbhost: {}
