# Серверный compose Портала ИБ. Работает только с готовыми образами из релиза:
# исходников и build-контекстов на сервере нет (сборка — docker-compose.build.yml на машине разработчика).
name: ibportal

services:
  db:
    image: ibportal-db:${VERSION:?VERSION не задан в .env}
    pull_policy: never              # образы только из релиза (docker load), реестра в контуре нет
    restart: unless-stopped
    environment:
      POSTGRES_DB: ibportal
      POSTGRES_USER: ${DB_OWNER_USER}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [back]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ibportal"]
      interval: 10s
      retries: 5

  backend:
    image: ibportal-backend:${VERSION:?VERSION не задан в .env}
    pull_policy: never              # образы только из релиза (docker load), реестра в контуре нет
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_APP_USER}:${DB_APP_PASSWORD}@db:5432/ibportal
      FILES_DIR: /data/files
      SESSION_SECRET: ${SESSION_SECRET}
      # Часовой пояс «сегодня» для сроков и автоматизаций; интервал проверки правил, 0 — выключено
      APP_TZ: ${APP_TZ:-Asia/Dushanbe}
      AUTOMATION_INTERVAL_MIN: ${AUTOMATION_INTERVAL_MIN:-60}
      # Кому верить в X-Forwarded-For: только nginx портала (его постоянный адрес в сети front, см. FRONTEND_IP).
      # Если перед порталом стоит балансировщик или другой обратный прокси — добавить его адрес через запятую.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.31.250.6}
      # Адреса настенных мониторов (IP и подсети через запятую). Пусто — вход учётной записи монитора запрещён.
      MONITOR_ALLOWED_IPS: ${MONITOR_ALLOWED_IPS:-}
      # Рабочие места администраторов: вход с правами settings.manage или users.manage только с них. Пусто — без ограничения.
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}
      # Ссылки на файлы документов — только на сервер OnlyOffice банка. Пусто — любая ссылка http(s).
      ONLYOFFICE_URL_PREFIX: ${ONLYOFFICE_URL_PREFIX:-}
      # Адрес портала, как его открывают пользователи (https://имя[:порт]). Обязателен: без него backend не стартует.
      PORTAL_URL: ${PORTAL_URL:-}
    volumes:
      - files:/data/files
    depends_on:
      db: { condition: service_healthy }
    networks: [back, front]
    healthcheck:
      test: ["CMD", "node", "dist/scripts/healthcheck.js"]
      interval: 15s

  frontend:
    image: ibportal-frontend:${VERSION:?VERSION не задан в .env}
    pull_policy: never              # образы только из релиза (docker load), реестра в контуре нет
    restart: unless-stopped
    ports: ["443:8443"]
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on: [backend]
    networks:
      # Постоянный адрес: backend доверяет X-Forwarded-For только ему (TRUSTED_PROXY_IPS).
      # Последний адрес подсети /29: Docker раздаёт динамические адреса с начала (.2), гонки при старте нет.
      front: { ipv4_address: "${FRONTEND_IP:-172.31.250.6}" }

  migrate:                          # разовый запуск: docker compose --profile tools run --rm migrate
    image: ibportal-backend:${VERSION:?VERSION не задан в .env}
    pull_policy: never              # образы только из релиза (docker load), реестра в контуре нет
    profiles: [tools]
    # Миграции, затем идемпотентный seed прав и системных ролей (ADR-0003).
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/prisma/seed/index.js"]
    environment:
      DATABASE_URL: postgresql://${DB_OWNER_USER}:${DB_OWNER_PASSWORD}@db:5432/ibportal
    depends_on:
      db: { condition: service_healthy }
    networks: [back]

volumes:
  pgdata: { external: true, name: ibportal_pgdata }
  files:  { external: true, name: ibportal_files }

networks:
  # Подсеть задана явно, чтобы у nginx был постоянный адрес. Если пересекается с сетями банка —
  # поменять FRONT_SUBNET, FRONTEND_IP и TRUSTED_PROXY_IPS в .env.
  front:
    ipam:
      config:
        - subnet: ${FRONT_SUBNET:-172.31.250.0/29}
  # backend ↔ db, без выхода наружу. Подсеть задана явно и согласуется с сетевым отделом (runbook).
  back:
    internal: true
    ipam:
      config:
        - subnet: ${BACK_SUBNET:-172.31.249.0/24}
