<title>Самооценка КБ — прототип</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the IS Portal shell (floating glass rail + work area on glass panels); the self-assessment section is one page with four tabs.
   Tokens are copied from the portal prototype so the section can be merged into it without restyling. */
:root{
  --bg:#F2F2F7;
  --amb-a:rgba(0,122,255,.20); --amb-b:rgba(90,200,250,.18); --amb-c:rgba(175,82,222,.12);
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.82);
  --sheen:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 42%);
  --glass-line:rgba(255,255,255,.80); --hl:rgba(255,255,255,.95);
  --line:rgba(60,60,67,.12); --line-2:rgba(60,60,67,.20);
  --shadow:0 1px 2px rgba(20,30,60,.04),0 12px 32px rgba(20,40,80,.07);
  --shadow-lg:0 24px 70px rgba(20,40,80,.20),0 2px 8px rgba(20,40,80,.06);
  --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.07); --hover:rgba(118,118,128,.08);
  --solid:#FAFAFC; --solid-2:#F3F3F7; --seg-on:#FFFFFF;
  --fg:#1D1D1F; --muted:#6E6E73; --faint:#AEAEB2;
  --accent:#007AFF; --accent-2:#3395FF; --accent-soft:rgba(0,122,255,.12); --accent-fg:#FFFFFF;
  --crit:#E0352B; --high:#C65D00; --med:#977000; --low:#248A3D; --info:#5856D6;
  --crit-soft:rgba(255,59,48,.12); --high-soft:rgba(255,149,0,.14); --med-soft:rgba(255,204,0,.18); --low-soft:rgba(52,199,89,.14);
  --scrim:rgba(0,0,0,.20); --toast-bg:rgba(29,29,31,.86); --toast-fg:#FFFFFF;
  --f-display:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
  --f-body:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
  --blur:blur(28px) saturate(180%);
  --r-lg:22px; --r-md:16px; --r-sm:11px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000;
  --amb-a:rgba(10,132,255,.16); --amb-b:rgba(100,210,255,.06); --amb-c:rgba(94,92,230,.09);
  --glass:rgba(255,255,255,.055); --glass-strong:rgba(28,28,30,.90);
  --sheen:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 40%);
  --glass-line:rgba(255,255,255,.10); --hl:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --shadow:0 1px 0 rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.55);
  --shadow-lg:0 24px 70px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.06);
  --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.14); --hover:rgba(255,255,255,.05);
  --solid:#0E0E10; --solid-2:#141416; --seg-on:#3A3A3C;
  --fg:#F5F5F7; --muted:#98989D; --faint:#636366;
  --accent:#0A84FF; --accent-2:#409CFF; --accent-soft:rgba(10,132,255,.22); --accent-fg:#FFFFFF;
  --crit:#FF453A; --high:#FF9F0A; --med:#FFD60A; --low:#30D158; --info:#7D7AFF;
  --crit-soft:rgba(255,69,58,.18); --high-soft:rgba(255,159,10,.18); --med-soft:rgba(255,214,10,.16); --low-soft:rgba(48,209,88,.16);
  --scrim:rgba(0,0,0,.55); --toast-bg:rgba(44,44,46,.92); --toast-fg:#F5F5F7;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;
  --amb-a:rgba(10,132,255,.16); --amb-b:rgba(100,210,255,.06); --amb-c:rgba(94,92,230,.09);
  --glass:rgba(255,255,255,.055); --glass-strong:rgba(28,28,30,.90);
  --sheen:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 40%);
  --glass-line:rgba(255,255,255,.10); --hl:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --shadow:0 1px 0 rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.55);
  --shadow-lg:0 24px 70px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.06);
  --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.14); --hover:rgba(255,255,255,.05);
  --solid:#0E0E10; --solid-2:#141416; --seg-on:#3A3A3C;
  --fg:#F5F5F7; --muted:#98989D; --faint:#636366;
  --accent:#0A84FF; --accent-2:#409CFF; --accent-soft:rgba(10,132,255,.22); --accent-fg:#FFFFFF;
  --crit:#FF453A; --high:#FF9F0A; --med:#FFD60A; --low:#30D158; --info:#7D7AFF;
  --crit-soft:rgba(255,69,58,.18); --high-soft:rgba(255,159,10,.18); --med-soft:rgba(255,214,10,.16); --low-soft:rgba(48,209,88,.16);
  --scrim:rgba(0,0,0,.55); --toast-bg:rgba(44,44,46,.92); --toast-fg:#F5F5F7;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(60vw 50vh at 8% 0%,var(--amb-a),transparent 70%),
  radial-gradient(50vw 45vh at 100% 30%,var(--amb-b),transparent 70%),
  radial-gradient(55vw 50vh at 45% 105%,var(--amb-c),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accent-soft),0 0 0 1px var(--accent)!important}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.rail,.panel,.toast,.sheet{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100%}
.rail{margin:12px 0 12px 12px;background:var(--sheen),var(--glass);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--hl),var(--shadow);border-radius:26px;padding:18px 12px;display:flex;flex-direction:column;gap:20px;position:sticky;top:12px;height:calc(100vh - 24px);z-index:5}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(160deg,var(--accent-2),var(--accent));color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;font-weight:700}
.brand b{font-family:var(--f-display);font-weight:600;font-size:15px;display:block}
.brand small{color:var(--muted);font-size:11.5px;display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:8px 11px;border:0;background:none;border-radius:11px;text-align:left;color:var(--fg);font-weight:500;font-size:13.5px}
.nav button svg{width:18px;height:18px;flex:none;color:var(--accent)}
.nav button.dim{color:var(--muted)}
.nav button.dim svg{color:var(--faint)}
.nav button:hover{background:var(--hover)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 14px var(--accent-soft)}
.nav button[aria-current="page"] svg{color:currentColor}
.rail-foot{margin-top:auto;display:grid;gap:8px;font-size:12px;color:var(--muted);padding:0 4px;min-width:0}
.me{display:grid;gap:4px;padding:9px 10px;border-radius:14px;background:var(--fill-2);min-width:0}
.me label{font-size:10.5px;color:var(--faint)}
.me select{border:0;background:none;font-weight:600;font-size:12.5px;padding:0;color:var(--fg);cursor:pointer;width:100%;min-width:0}
.me small{font-size:11px;line-height:1.35}
.seg{display:inline-flex;padding:2px;border-radius:10px;background:var(--fill);gap:2px;width:100%}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:4px 6px;font-size:12px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.demo-tag{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--fill-2);width:max-content}
option{background-color:var(--solid);color:var(--fg)}

main{padding-block:26px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1;margin:0;letter-spacing:-.025em}
.head p{margin:6px 0 0;color:var(--muted);max-width:70ch}
.bar-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar-top .sp{flex:1}
.inp,select.inp{background:var(--fill);border:1px solid transparent;border-radius:9px;padding:6px 10px;min-width:0}
.inp:focus{outline:none;background:var(--solid);box-shadow:0 0 0 3px var(--accent-soft),0 0 0 1px var(--accent)}
textarea.inp{width:100%;min-height:64px;resize:vertical;line-height:1.45}
.btn{border:0;background:var(--fill);padding:7px 15px;border-radius:999px;font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--accent);transition:background .18s,transform .12s}
.btn:hover{background:var(--fill-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 14px var(--accent-soft)}
.btn.sm{padding:4px 11px;font-size:12.5px}
.btn.ghost{background:none;padding-inline:8px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger-t{color:var(--crit)}
.btn:disabled{opacity:.45;transform:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--fill-2);color:var(--muted)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}.chip.high{background:var(--high-soft);color:var(--high)}
.chip.med{background:var(--med-soft);color:var(--med)}.chip.low{background:var(--low-soft);color:var(--low)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.hint{font-size:12px;color:var(--muted)}
.note{padding:11px 14px;border-radius:var(--r-sm);background:var(--accent-soft);font-size:13px}
.note.warn{background:var(--high-soft)}
.note.ro{background:var(--fill-2);color:var(--muted)}

.tabs{display:flex;gap:2px;padding:2px;border-radius:11px;background:var(--fill);width:fit-content;max-width:100%;overflow-x:auto;margin-bottom:14px}
.tabs button{border:0;background:none;padding:6px 16px;font-weight:500;font-size:13px;border-radius:9px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--seg-on);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}

.panel{background:var(--sheen),var(--glass);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--hl),var(--shadow);border-radius:var(--r-lg);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h3{margin:0;font-family:var(--f-display);font-size:15px;font-weight:600;letter-spacing:-.015em}
.panel-b{padding:14px 18px 16px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.grid>*{min-width:0}
.w4{grid-column:span 4}.w5{grid-column:span 5}.w6{grid-column:span 6}.w7{grid-column:span 7}.w8{grid-column:span 8}.w12{grid-column:span 12}

/* level card */
.lvl{display:grid;gap:14px;padding:18px 20px 20px}
.lvl-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.lvl-name{font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.lvl-sub{color:var(--muted);margin-top:4px;max-width:60ch;font-size:13px}
.lvl-score{text-align:right}
.lvl-score b{font-family:var(--f-display);font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.lvl-score span{color:var(--muted);font-size:15px}
.scale{position:relative;padding-top:26px}
.scale-track{display:flex;height:12px;border-radius:999px;overflow:hidden;gap:2px}
.scale-track i{display:block;height:100%}
.scale-lbl{display:flex;gap:2px;margin-top:7px}
.scale-lbl span{font-size:11.5px;color:var(--muted);line-height:1.25}
.scale-lbl b{display:block;color:var(--fg);font-weight:600;font-size:12px}
.mk{position:absolute;top:0;transform:translateX(-50%);display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.mk::after{content:"";width:2px;height:20px;border-radius:2px;background:currentColor}
.mk.cur{color:var(--fg)}
.mk.prev{color:var(--faint)}
.z1{background:var(--crit)}.z2{background:var(--high)}.z3{background:var(--accent)}.z4{background:var(--low)}
.z1,.z2,.z3,.z4{opacity:.85}

.ring{display:flex;gap:14px;align-items:center}
.keys{display:grid;gap:6px;margin-top:12px}
.key{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;padding:7px 10px;border-radius:10px;background:var(--fill-2)}
.key button{border:0;background:none;padding:0;text-align:left;color:var(--fg)}
.key button:hover{color:var(--accent)}
.ok{color:var(--low)}.no{color:var(--crit)}

svg text{fill:var(--muted);font-family:var(--f-body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

.dbars{display:grid;gap:9px}
.dbar{display:grid;grid-template-columns:minmax(0,1fr) 120px 36px 48px;gap:10px;align-items:center;font-size:12.5px;border:0;background:none;padding:2px 0;text-align:left;color:var(--fg)}
.dbar:hover .t{color:var(--accent)}
.dbar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbar .track{height:8px;background:var(--fill);border-radius:999px;position:relative;overflow:hidden}
.dbar .track i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent)}
.dbar .track u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--faint);text-decoration:none}
.dbar .n{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.delta{font-size:11.5px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.delta.up{color:var(--low)}.delta.dn{color:var(--crit)}.delta.eq{color:var(--faint)}

.weak{display:grid}
.weak button{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;border:0;background:none;border-bottom:1px solid var(--line);padding:9px 2px;text-align:left;color:var(--fg);font-size:13px}
.weak button:last-child{border-bottom:0}
.weak button:hover{background:var(--hover)}
.code{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}

/* checklist */
.cl{display:grid;grid-template-columns:264px minmax(0,1fr);gap:12px;align-items:start}
.doms{padding:8px;display:grid;gap:2px;position:sticky;top:12px}
.doms button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center}
.doms button:hover{background:var(--hover)}
.doms button[aria-pressed="true"]{background:var(--accent-soft)}
.doms button[aria-pressed="true"] b{color:var(--accent)}
.doms b{font-weight:600;font-size:13px}
.doms small{color:var(--muted);font-size:11.5px;grid-column:1}
.doms .avg{grid-row:1/3;grid-column:2;font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.prog{height:4px;background:var(--fill);border-radius:999px;overflow:hidden;grid-column:1/-1;margin-top:3px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px}
.prog i.full{background:var(--low)}
.secs{display:grid;gap:12px}
.dom-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:2px 4px}
.dom-h h2{margin:0;font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:-.02em}
.sec{scroll-margin-top:16px}
.sec.flash{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.sec-h{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:14px 18px 10px;flex-wrap:wrap}
.sec-h h3{margin:0;font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:-.015em}
.sec-h h3 .code{margin-right:6px}
details.target{margin:0 18px;border-radius:var(--r-sm);background:var(--fill-2);padding:9px 12px;font-size:13px}
details.target summary{cursor:pointer;color:var(--muted);font-weight:500;font-size:12.5px}
details.target p{white-space:pre-line;margin:8px 0 2px}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 18px}
.opt{border:1px solid var(--line);background:var(--solid);border-radius:var(--r-md);padding:10px 12px;text-align:left;display:grid;gap:6px;align-content:start;font-size:12.5px;line-height:1.45;color:var(--fg);transition:border-color .15s,background .15s,box-shadow .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .oh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.opt .oh i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;background:var(--fill);color:var(--muted);flex:none}
.opt .ot{white-space:pre-line;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.opt[aria-pressed="true"] .oh i{background:var(--accent);color:var(--accent-fg)}
.opt[aria-pressed="true"] .ot{color:var(--fg)}
.opt.tgt:not([aria-pressed="true"]){border-style:dashed;border-color:var(--low)}
.opt:disabled{cursor:default}
.sec-f{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;padding:4px 18px 14px;align-items:start}
.sec-f label{display:grid;gap:5px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.sec-x{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding:10px 18px 14px;border-top:1px solid var(--line)}
.tasks{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tk{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--fill-2)}
.mini{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto auto;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--fill-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.hist{font-size:11.5px;color:var(--muted)}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
td select{font-size:12.5px;padding:4px 8px}
td .btn.ghost{white-space:normal;text-align:left;justify-content:flex-start}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi{padding:14px 16px;display:grid;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:500}
.lvlpill{display:inline-flex;gap:4px;align-items:center;font-variant-numeric:tabular-nums}
.lvlpill i{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;color:#FFFFFF}

/* ---------- scoring (mirror of lib/assessment-score.ts) ---------- */
function score(a){
  const doms=METH.domains.map(d=>{
    const lv=d.sections.map(s=>a.answers[s.code].level).filter(v=>v!=null);
    const tv=d.sections.map(s=>{const x=a.answers[s.code];return Math.max(x.target||0,x.level||0)||null}).filter(v=>v!=null);
    const sum=lv.reduce((p,c)=>p+c,0);
    return {no:d.no,name:d.name,n:d.sections.length,done:lv.length,sum,max:d.sections.length*4,avg:lv.length?sum/lv.length:null,tavg:tv.length?tv.reduce((p,c)=>p+c,0)/tv.length:null};
  });
  const done=SECTIONS.filter(s=>a.answers[s.code].level!=null).length;
  const total=doms.reduce((p,d)=>p+d.sum,0);
  const dist=[1,2,3,4].map(l=>SECTIONS.filter(s=>a.answers[s.code].level===l).length);
  return {doms,done,complete:done===SECTIONS.length,total,dist,maturity:maturity(total,a)};
}
function maturity(total,a){
  const m=METH.maturity;
  if(total>=86){return KEYS.every(k=>a.answers[k].level===4)?m[3]:m[2]}
  if(total>=67)return m[2];
  if(total>=44)return m[1];
  return m[0];
}

        return `<button type="button" class="dbar" data-dom="${x.no}"><span class="t">${x.no}. ${esc(x.name)}</span><span class="track"><i style="width:${(x.avg||0)/4*100}%"></i>${pv!=null?`<u style="left:calc(${pv/4*100}% - 1px)"></u>`:''}</span><span class="n">${n1(x.avg)}</span><span class="delta ${dd==null||Math.abs(dd)<.01?'eq':dd>0?'up':'dn'}">${dd==null?'':Math.abs(dd)<.01?'0':(dd>0?'+':'')+n1(dd)}</span></button>`}).join('')}
      </div></section>

    <section class="panel w5"><div class="panel-h"><h3>Распределение ответов</h3><span class="hint">разделов на уровне</span></div><div class="panel-b">${donut(sc.dist)}</div></section>

    <section class="panel w7"><div class="panel-h"><h3>Слабые места</h3><span class="hint">разделы на базовом уровне, ключевые первыми</span></div>
      <div class="panel-b weak">${weak.length?weak.slice(0,8).map(s=>{const x=a.answers[s.code];return `<button type="button" data-goto="${s.code}"><span class="code">${s.code}</span><span>${esc(s.name)} <span class="hint">· ${esc(METH.domains[s.domain-1].name)}</span></span><span class="row">${s.key?'<span class="chip high">ключевой</span>':''}${x.target?`<span class="chip low">цель ${x.target}</span>`:''}</span></button>`}).join('')+(weak.length>8?`<div class="hint" style="padding-top:8px">и ещё ${weak.length-8}</div>`:''):'<p class="hint">Разделов на базовом уровне нет.</p>'}</div></section>
  </div>`;
}
function ring(v,t){const r=26,c=2*Math.PI*r,f=v/t;return `<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--fill)" stroke-width="7"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${f>=1?'var(--low)':'var(--accent)'}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c*f} ${c}" transform="rotate(-90 32 32)"/></svg>`}
function lvlPill(v){return `<span class="lvlpill"><i class="l${v||0}">${v||'–'}</i></span>`}
function radar(sc,ps){
  const W=520,H=330,cx=W/2,cy=H/2+4,R=118,N=10;
  const pt=(i,v)=>{const ang=-Math.PI/2+i*2*Math.PI/N;return [cx+Math.cos(ang)*R*v/4,cy+Math.sin(ang)*R*v/4]};
  const poly=vals=>vals.map((v,i)=>pt(i,v||0).map(n=>n.toFixed(1)).join(',')).join(' ');
  let g='';
  for(let l=1;l<=4;l++)g+=`<polygon points="${poly(Array(N).fill(l))}" fill="none" stroke="var(--line-2)" stroke-width="1"/>`;
  for(let i=0;i<N;i++){const [x,y]=pt(i,4);g+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`}
  for(let l=1;l<=4;l++){const [x,y]=pt(0,l);g+=`<text x="${x+4}" y="${y+3}" font-size="9.5">${l}</text>`}
  const short=['Целеполагание','Активы','Мониторинг','Инциденты','Уязвимости','Доступ','Конфигурации','Устойчивость','Сеть и инфр.','Контроль защищ.'];
  for(let i=0;i<N;i++){const [x,y]=pt(i,4.62);const anchor=Math.abs(x-cx)<8?'middle':x>cx?'start':'end';g+=`<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" font-size="11" text-anchor="${anchor}">${i+1}. ${short[i]}</text>`}
  const tv=sc.doms.map(d=>d.tavg);
  if(tv.some(v=>v))g+=`<polygon points="${poly(tv.map((v,i)=>v||sc.doms[i].avg||0))}" fill="none" stroke="var(--low)" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  if(ps)g+=`<polygon points="${poly(ps.doms.map(d=>d.avg))}" fill="none" stroke="var(--faint)" stroke-width="1.6"/>`;
  g+=`<polygon points="${poly(sc.doms.map(d=>d.avg))}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/>`;
  sc.doms.forEach((d,i)=>{const [x,y]=pt(i,d.avg||0);g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--accent)"/>`});
  return `<div class="tbl-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W+40}px;display:block;margin:auto;min-width:340px" role="img" aria-label="Радар средних баллов по доменам">${g}</svg></div>`;
}
function donut(dist){
  const tot=dist.reduce((p,c)=>p+c,0)||1,r=52,c=2*Math.PI*r;let off=0,arcs='';
  const col=['var(--crit)','var(--high)','var(--accent)','var(--low)'];
  dist.forEach((v,i)=>{if(!v)return;const len=c*v/tot;arcs+=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${col[i]}" stroke-width="18" stroke-dasharray="${Math.max(len-2,0)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len});
  const answered=dist.reduce((p,q)=>p+q,0);
  return `<div class="row" style="gap:22px;align-items:center"><svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Распределение ответов"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--fill)" stroke-width="18"/>${arcs}<text x="70" y="68" text-anchor="middle" font-size="24" font-weight="600" style="fill:var(--fg)">${answered}</text><text x="70" y="86" text-anchor="middle" font-size="11">ответов</text></svg>
  <div style="display:grid;gap:8px;min-width:0">${dist.map((v,i)=>`<div class="row" style="gap:10px;font-size:13px">${lvlPill(i+1)}<span style="min-width:96px">${LVL[i+1]}</span><b class="num">${v}</b><span class="hint">${Math.round(v/tot*100)}%</span></div>`).join('')}</div></div>`;
}

      ${can('edit')&&a.status!=='archived'?`<button class="btn sm" type="button" data-mini="${s.code}">Создать задачу</button>`:''}</div>
      <span class="hist">${h?`Изменено: ${esc(h.who)}, ${h.at}: ${h.from??'—'} → ${h.to??'—'}`:''}</span></div>
    ${S.mini===s.code?`<div class="mini">
      <input class="inp" id="mt-t" value="${esc(s.code+' '+s.name+(x.target?': с '+(x.level||'—')+' до '+x.target:''))}" aria-label="Название задачи">

  </article>`;
}

/* ---------- actions ---------- */
function logA(a,txt){a.log.push({at:nowStr(),txt:txt+' · '+me().name})}
function setAnswer(a,code,patch){

  if('level' in patch&&patch.level!==x.level){x.hist.push({who:me().name,at:nowStr(),from:x.level,to:patch.level});logA(a,`Раздел ${code}: ${x.level??'—'} → ${patch.level??'—'}`)}
  if('target' in patch&&patch.target!==x.target)logA(a,`Раздел ${code}: цель ${patch.target??'—'}`);

}
function gotoSec(code,mini){
  S.tab='check';S.dom=SEC[code].domain;S.mini=mini?code:null;render();

}
document.addEventListener('click',async e=>{

  if(t.dataset.tab){S.tab=t.dataset.tab;S.mini=null;render();return}

  if(t.dataset.lvl){if(!editable(a))return;const l=+t.dataset.lvl,c=t.dataset.code;setAnswer(a,c,{level:a.answers[c].level===l?null:l});const s=score(a);toast(`Сохранено. Итог ${s.total} из 96 · ${s.maturity.name}`);render();
    const el=document.getElementById('sec-'+c.replace('.','-'));if(el)el.scrollIntoView({block:'nearest'});return}
  if(t.dataset.mini){S.mini=S.mini===t.dataset.mini?null:t.dataset.mini;const c=t.dataset.mini;render();const el=document.getElementById('sec-'+c.replace('.','-'));if(el)el.scrollIntoView({block:'nearest'});return}

    S.tasks.push({id:'t'+tseq++,aid:a.id,code:c,title,who:$('#mt-w').value,due:$('#mt-d').value||'',st:'Новые'});logA(a,`Задача по разделу ${c}`);S.mini=null;toast('Задача создана на доске «Задачи»');render();return}
  if(act==='close'){S.sheet=null;render();return}
  if(['reopen','new','import'].includes(act)){S.sheet=S.sheet===act?null:act;render();return}
  if(act==='approve'){const s=score(a);if(!s.complete){toast(`Заполните все разделы: осталось ${24-s.done}`);gotoSec(SECTIONS.find(x=>a.answers[x.code].level==null).code);return}
    a.status='approved';a.approvedBy=me().name;a.approvedAt=todayIso();a.result=s;logA(a,`Зафиксирована: ${s.total} из 96, «${s.maturity.name}»`);toast('Оценка зафиксирована');render();return}
  if(act==='reopen-ok'){const c=$('#sh-c').value.trim();
    a.status='draft';a.result=undefined;logA(a,'Возвращена в черновик'+(c?': '+c:''));
    S.sheet=null;toast('Оценка снова в черновике');render();return}
  if(act==='new-ok'){const cp=$('#nw-c').value,src=S.list.find(x=>x.id===cp);
    const n={id:'a'+seq++,title:$('#nw-t').value.trim()||'Новая оценка',date:$('#nw-d').value||todayIso(),status:'draft',example:true,profile:{...(src?src.profile:a1.profile)},answers:blankAnswers(),log:[]};
    if(src)for(const c in src.answers){n.answers[c].level=src.answers[c].level;n.answers[c].target=src.answers[c].target}
    n.log.push({at:nowStr(),txt:(src?'Создана копией «'+src.title+'»':'Создана пустой')+' · '+me().name});
    S.list.push(n);S.cur=n.id;S.sheet=null;S.tab='check';S.dom=1;toast('Оценка создана');render();return}
  if(act==='imp-ok'){applyImport(a);return}
  if(act==='export'){exportXlsx();return}
  if(act==='pres'){S.pres=0;renderPres();return}
});
document.addEventListener('change',e=>{
  const t=e.target,a=curA();
  if(t.id==='role'){S.role=t.value;S.sheet=null;S.mini=null;render();return}
  if(t.id==='pick'){S.cur=t.value;S.sheet=null;S.mini=null;render();return}
  if(t.id==='cmp-a'){S.cmpA=t.value;render();return}
  if(t.id==='cmp-b'){S.cmpB=t.value;render();return}
  if(t.dataset.tst){const tk=S.tasks.find(x=>x.id===t.dataset.tst);tk.st=t.value;toast('Статус задачи: '+t.value);render();return}
  if(t.dataset.f&&editable(a)){const c=t.dataset.code,f=t.dataset.f;let v=t.value;if(f==='target')v=v?+v:null;if(f==='owner')v=v||null;
    setAnswer(a,c,{[f]:v});toast('Сохранено');if(f==='target')render();return}
  if(t.id==='imp-f'&&t.files[0])readImport(t.files[0]);
});

/* ---------- Excel import (same parsing rules as the backend spec, section 9) ---------- */
let pending=null;
function readImport(file){
  const fr=new FileReader();
  fr.onload=()=>{try{
    const wb=XLSX.read(new Uint8Array(fr.result),{type:'array',cellStyles:true,cellDates:true});
    const ws=wb.Sheets['Чек-лист'];if(!ws)throw new Error('В файле нет листа «Чек-лист». Нужен шаблон экспресс-оценки.');
    const rng=XLSX.utils.decode_range(ws['!ref']),rows=ws['!rows']||[];
    const v=(r,c)=>{const x=ws[XLSX.utils.encode_cell({r,c})];return x?x.v:undefined};
    const hidden=r=>rows[r]&&rows[r].hidden;
    const found={},errs=[];
    for(let r=1;r<=rng.e.r;r++){
      if(v(r,4)!=='Дополнительный комментарий'||hidden(r))continue;
      let code=null;
      for(let k=r-1;k>=0;k--){const c=v(k,2);if(hidden(k))continue;const mm=c&&String(c).match(/^(\d+)\.(\d+)\.?\s*/);if(mm){code=mm[1]+'.'+mm[2];break}}
      if(!code||!SEC[code]){errs.push('Строка '+(r+1)+': раздел не найден');continue}
      const raw=v(r-1,4),cm=v(r+1,4);
      let level=null;
      if(raw!==undefined&&raw!==''&&raw!=='Выбрать ответ'){level=Number(raw);if(![1,2,3,4].includes(level)){errs.push(code+': значение «'+raw+'» вне 1–4');level=null}}
      found[code]={level,comment:cm?String(cm):''};
    }
    const gi=wb.Sheets['Общая информация'],gv=a=>gi&&gi[a]?gi[a].v:undefined;
    const prof={org:gv('E7'),respondent:gv('E11'),position:gv('E13'),employees:gv('E32'),date:gv('E9')};
    pending={found,prof};
    const a=curA();
    const diff=SECTIONS.filter(s=>found[s.code]&&found[s.code].level!==a.answers[s.code].level);
    const miss=SECTIONS.filter(s=>!found[s.code]).map(s=>s.code);
    $('#imp-res').innerHTML=`<div class="note">Найдено разделов: <b>${Object.keys(found).length} из 24</b>${prof.respondent?` · респондент ${esc(prof.respondent)}`:''}${prof.date instanceof Date?` · дата ${prof.date.toLocaleDateString('ru-RU')}`:''}.
      ${miss.length?' Не найдены: '+miss.join(', ')+'.':''}${errs.length?'<br>'+errs.map(esc).join('<br>'):''}</div>
      ${diff.length?`<div class="tbl-wrap" style="max-height:280px;overflow:auto"><table><thead><tr><th>Раздел</th><th>Было</th><th>Станет</th></tr></thead><tbody>${diff.map(s=>`<tr><td><span class="code">${s.code}</span> ${esc(s.name)}</td><td>${lvlPill(a.answers[s.code].level)}</td><td>${lvlPill(found[s.code].level)}</td></tr>`).join('')}</tbody></table></div>
      <div class="row"><button class="btn primary" type="button" data-act="imp-ok">Применить ${diff.length} изменени${diff.length%10===1&&diff.length!==11?'е':(diff.length%10>=2&&diff.length%10<=4&&(diff.length<12||diff.length>14))?'я':'й'}</button></div>`:'<p class="hint">Ответы в файле совпадают с оценкой. Менять нечего.</p>'}`;
  }catch(err){$('#imp-res').innerHTML=`<div class="note warn">${esc(err.message||'Не удалось прочитать файл')}</div>`}};
  fr.readAsArrayBuffer(file);
}
function applyImport(a){
  if(!pending||!editable(a))return;
  let n=0;
  for(const [c,v] of Object.entries(pending.found)){
    if(v.level!==a.answers[c].level){a.answers[c].hist.push({who:me().name,at:nowStr(),from:a.answers[c].level,to:v.level});a.answers[c].level=v.level;n++}
    if(v.comment)a.answers[c].comment=v.comment;
  }
  const p=pending.prof;['org','respondent','position','employees'].forEach(k=>{if(p[k]!=null)a.profile[k]=p[k]});
  logA(a,`Импорт из Excel: изменено разделов ${n}`);pending=null;S.sheet=null;toast(`Импортировано: изменено ${n} разделов`);render();
}

/* ---------- Excel export: flat tables for analysis (one row = one fact), all assessments ---------- */
function sheetOf(rows,cols){const ws=XLSX.utils.aoa_to_sheet(rows,{cellDates:true});ws['!cols']=cols.map(w=>({wch:w}));
  ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(rows.length-1,0),c:rows[0].length-1}})};return ws}
const asDate=iso=>iso?new Date(iso+'T00:00:00'):'';
async function exportXlsx(){
  const wb=XLSX.utils.book_new(),list=S.list.filter(x=>x.status!=='archived');
  const r1=[['ID оценки','Оценка','Дата','Статус','Итог','Максимум','Заполнено разделов','Уровень КБ','Итог предварительный','Дата фиксации']];
  const r2=[['ID оценки','Оценка','Дата','Домен №','Домен','Код','Раздел','Ключевой','Балл','Уровень','Целевой балл','Разрыв','Комментарий','Задач','Задач выполнено']];
  const r3=[['ID оценки','Оценка','Дата','Домен №','Домен','Разделов','Отвечено','Сумма','Максимум','Средний балл','Средний целевой']];
  const r4=[['ID оценки','Оценка','Код','Раздел','Задача','Исполнитель','Срок','Статус']];
  list.forEach(a=>{const s=score(a);
    r1.push([a.id,a.title,asDate(a.date),STATUS[a.status][0],s.total,96,s.done,s.maturity.name,s.complete?'нет':'да',asDate(a.approvedAt)]);
    SECTIONS.forEach(sec=>{const x=a.answers[sec.code],tk=S.tasks.filter(t=>t.aid===a.id&&t.code===sec.code);
      r2.push([a.id,a.title,asDate(a.date),sec.domain,METH.domains[sec.domain-1].name,sec.code,sec.name,sec.key?'да':'нет',x.level??'',x.level?LVL[x.level]:'',x.target??'',x.target&&x.target>(x.level||0)?x.target-(x.level||0):0,x.comment||'',tk.length,tk.filter(t=>t.st==='Готово').length])});
    s.doms.forEach(d=>r3.push([a.id,a.title,asDate(a.date),d.no,d.name,d.n,d.done,d.sum,d.max,d.avg==null?'':+d.avg.toFixed(2),d.tavg==null?'':+d.tavg.toFixed(2)]));
    S.tasks.filter(t=>t.aid===a.id).forEach(t=>r4.push([a.id,a.title,t.code,SEC[t.code]?SEC[t.code].name:'',t.title,t.who,asDate(t.due),t.st]));
  });
  const r5=[['Домен №','Домен','Код','Раздел','Ключевой','Целевое состояние','1 Базовый','2 Средний','3 Высокий','4 Продвинутый']];
  SECTIONS.forEach(s=>r5.push([s.domain,METH.domains[s.domain-1].name,s.code,s.name,s.key?'да':'нет',s.target,s.criteria[1],s.criteria[2],s.criteria[3],s.criteria[4]]));
  XLSX.utils.book_append_sheet(wb,sheetOf(r1,[9,26,11,14,7,9,10,22,12,12]),'Оценки');
  XLSX.utils.book_append_sheet(wb,sheetOf(r2,[9,26,11,8,30,6,44,9,6,12,8,7,44,6,8]),'Ответы');
  XLSX.utils.book_append_sheet(wb,sheetOf(r3,[9,26,11,8,34,9,9,7,9,10,10]),'Домены');
  XLSX.utils.book_append_sheet(wb,sheetOf(r4,[9,26,6,36,50,16,11,12]),'Задачи');
  XLSX.utils.book_append_sheet(wb,sheetOf(r5,[8,30,6,40,9,60,50,50,50,50]),'Методика');
  const data=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  let dl=null;try{dl=await window.claude?.use?.('downloads')}catch(e){}
  if(!dl){toast('Скачивание недоступно в этом просмотре. В продукте файл отдаёт backend');return}
  try{await dl.save({filename:'Самооценка_КБ_'+todayIso()+'.xlsx',data:new Uint8Array(data)});toast('Файл сохранён')}
  catch(err){if(err&&err.code!=='declined')toast('Не удалось сохранить файл')}
}

/* ---------- presentation: full-screen slides from the same charts, signature in the corner ---------- */
const SIGNATURE='Спроектировано: И. Машарипов · Отдел информационной безопасности'; // в продукте: «Настройки → Презентация», право settings.manage
function slides(a){
  const sc=score(a),p=prevOf(a),ps=p?score(p):null,m=sc.maturity,d=ps?sc.total-ps.total:null;
  const yr=x=>esc(x.title.replace('Экспресс-оценка ',''));
  const lo=24,hi=96,pct=v=>((Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*100),zones=[[24,43],[44,66],[67,85],[86,96]];
  const weak=SECTIONS.filter(s=>a.answers[s.code].level===1).sort((x,y)=>(y.key-x.key));
  const g=gaps(a);
  return [
   {t:'Итог',h:`<div class="ps-title"><div class="hint">${esc(a.profile.org||'')} · ${fmtD(a.date)}${sc.complete?'':' · предварительно'}</div><h1>${esc(a.title)}</h1>
     <div class="ps-big"><b>${sc.total}</b><span>из 96</span></div><div class="ps-lvl">${m.name}</div><p>${esc(m.description)}</p>
     ${d!=null?`<div class="delta ${d>0?'up':d<0?'dn':'eq'}" style="font-size:1.1em;text-align:left">${(d>0?'+':'')+d} баллов к ${yr(p)}</div>`:''}</div>`},
   {t:'Шкала уровней',h:`<h2>Где мы на шкале</h2><div class="scale ps-scale">${ps?`<div class="mk prev" style="left:${pct(ps.total)}%">${yr(p)}: ${ps.total}</div>`:''}<div class="mk cur" style="left:${pct(sc.total)}%">${yr(a)}: ${sc.total}</div>
     <div class="scale-track">${zones.map((z,i)=>`<i class="z${i+1}" style="flex:${z[1]-z[0]+1}"></i>`).join('')}</div>
     <div class="scale-lbl">${zones.map((z,i)=>`<span style="flex:${z[1]-z[0]+1}"><b>${METH.maturity[i].name}</b>${z[0]}–${z[1]}</span>`).join('')}</div></div>
     <div class="keys ps-keys"><div class="hint">«Результативная КБ» требует 86+ баллов и 4 в ключевых разделах</div>${KEYS.map(k=>{const v=a.answers[k].level;return `<div class="key"><span class="${v===4?'ok':'no'}">${v===4?'✓':'✗'}</span><span><span class="code">${k}</span> ${esc(SEC[k].name)}</span>${lvlPill(v)}</div>`}).join('')}</div>`},
   {t:'Профиль по доменам',h:`<h2>Профиль по доменам</h2><div class="legend"><span><i style="background:var(--accent)"></i>${yr(a)}</span>${ps?`<span><i style="background:var(--faint)"></i>${yr(p)}</span>`:''}${sc.doms.some(x=>x.tavg)?'<span><i style="background:var(--low)"></i>Цель</span>':''}</div><div class="ps-chart">${radar(sc,ps)}</div>`},
   {t:'Средний балл',h:`<h2>Средний балл по доменам</h2><div class="dbars ps-bars">${sc.doms.map((x,i)=>{const pv=ps?ps.doms[i].avg:null,dd=(x.avg!=null&&pv!=null)?x.avg-pv:null;return `<div class="dbar"><span class="t">${x.no}. ${esc(x.name)}</span><span class="track"><i style="width:${(x.avg||0)/4*100}%"></i>${pv!=null?`<u style="left:calc(${pv/4*100}% - 1px)"></u>`:''}</span><span class="n">${n1(x.avg)}</span><span class="delta ${dd==null||Math.abs(dd)<.01?'eq':dd>0?'up':'dn'}">${dd==null||Math.abs(dd)<.01?'':(dd>0?'+':'')+n1(dd)}</span></div>`}).join('')}</div>`},
   {t:'Распределение и слабые места',h:`<h2>Распределение ответов и слабые места</h2><div class="ps-two"><div>${donut(sc.dist)}</div><div class="weak">${weak.slice(0,7).map(s=>`<div class="ps-w"><span class="code">${s.code}</span><span>${esc(s.name)}</span>${s.key?'<span class="chip high">ключевой</span>':'<span></span>'}</div>`).join('')}</div></div>`},
   {t:'План',h:`<h2>План улучшений</h2>${g.length?`<div class="ps-plan">${g.map(s=>{const x=a.answers[s.code],tk=S.tasks.filter(t=>t.aid===a.id&&t.code===s.code);return `<div class="ps-w"><span class="code">${s.code}</span><span>${esc(s.name)}</span><span class="row">${lvlPill(x.level)} → ${lvlPill(x.target)}</span><span class="hint">${tk.length?esc(tk[0].st):'задачи нет'}</span></div>`}).join('')}</div><p class="hint">При достижении целей: +${g.reduce((p,s)=>p+(a.answers[s.code].target-(a.answers[s.code].level||0)),0)} баллов.</p>`:'<p class="hint">Целевые уровни не заданы.</p>'}`}
  ];
}
function renderPres(){
  let el=$('#pres');
  if(S.pres==null){if(el)el.remove();document.removeEventListener('keydown',presKey);return}
  const a=curA(),sl=slides(a),i=Math.max(0,Math.min(S.pres,sl.length-1));S.pres=i;
  if(!el){el=document.createElement('div');el.id='pres';el.className='pres';el.setAttribute('role','dialog');el.setAttribute('aria-label','Презентация самооценки');document.body.appendChild(el);document.addEventListener('keydown',presKey)}
  el.innerHTML=`<div class="ps-slide">${sl[i].h}</div>
   <div class="ps-sign">${esc(SIGNATURE)}<br>Подготовил: ${esc(me().name)}</div>
   <div class="ps-ctl"><button type="button" data-ps="prev" aria-label="Назад">‹</button><span>${i+1} / ${sl.length} · ${esc(sl[i].t)}</span><button type="button" data-ps="next" aria-label="Вперёд">›</button><button type="button" data-ps="fs" aria-label="На весь экран">⤢</button><button type="button" data-ps="x" aria-label="Закрыть">✕</button></div>`;
}
function presKey(e){if(S.pres==null)return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();S.pres++;renderPres()}else if(e.key==='ArrowLeft'){S.pres=Math.max(0,S.pres-1);renderPres()}else if(e.key==='Escape'){closePres()}}
function closePres(){S.pres=null;try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}renderPres()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-ps]');if(!b)return;const k=b.dataset.ps;
  if(k==='next'){S.pres++;renderPres()}else if(k==='prev'){S.pres=Math.max(0,S.pres-1);renderPres()}else if(k==='x')closePres();
  else if(k==='fs'){const el=$('#pres');try{document.fullscreenElement?document.exitFullscreen():el.requestFullscreen().catch(()=>toast('Полный экран недоступен в этом просмотре'))}catch(err){toast('Полный экран недоступен в этом просмотре')}}});

/* ---------- theme, toast ---------- */
let tt;function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2600)}
$('#theme').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const th=b.dataset.th;
  if(th==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',th);
  [...$('#theme').children].forEach(x=>x.setAttribute('aria-pressed',x===b))});
render();
})();
</script>
