<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Портал ИБ — демо</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: floating glass sidebar over a soft ambient field, work area on glass cards; monitor mode is one full-bleed glass wall screen.
   Light = iOS grouped grey; dark = true black (#000) with glass lifted only by highlight and hairlines. Accent = Apple system blue. */
:root{
  --bg:#F2F2F7;
  --amb-a:rgba(0,122,255,.20); --amb-b:rgba(90,200,250,.18); --amb-c:rgba(175,82,222,.12);
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.80);
  --sheen:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 42%);
  --glass-line:rgba(255,255,255,.80); --hl:rgba(255,255,255,.95);
  --line:rgba(60,60,67,.12); --line-2:rgba(60,60,67,.20);
  --shadow:0 1px 2px rgba(20,30,60,.04),0 12px 32px rgba(20,40,80,.07);
  --shadow-lg:0 24px 70px rgba(20,40,80,.20),0 2px 8px rgba(20,40,80,.06);
  --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.07); --hover:rgba(118,118,128,.08);
  --solid:#FAFAFC; --solid-2:#F3F3F7; --solid-hover:#EEEEF3; --seg-on:#FFFFFF;
  --fg:#1D1D1F; --muted:#6E6E73; --faint:#AEAEB2;
  --accent:#007AFF; --accent-2:#3395FF; --accent-soft:rgba(0,122,255,.12); --accent-fg:#FFFFFF;
  --crit:#E0352B; --high:#C65D00; --med:#977000; --low:#248A3D; --info:#5856D6;
  --crit-soft:rgba(255,59,48,.12); --high-soft:rgba(255,149,0,.14); --med-soft:rgba(255,204,0,.18); --low-soft:rgba(52,199,89,.14);
  --paper:#FFFFFF; --paper-fg:#1D1D1F; --scrim:rgba(0,0,0,.20); --toast-bg:rgba(29,29,31,.86); --toast-fg:#FFFFFF;
  --f-display:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
  --f-body:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
  --f-mono:"SF Mono",ui-monospace,Menlo,"Cascadia Mono",Consolas,monospace;
  --blur:blur(28px) saturate(180%);
  --r-lg:22px; --r-md:16px; --r-sm:11px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000;
  --amb-a:rgba(10,132,255,.16); --amb-b:rgba(100,210,255,.06); --amb-c:rgba(94,92,230,.09);
  --glass:rgba(255,255,255,.055); --glass-strong:rgba(28,28,30,.86);
  --sheen:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 40%);
  --glass-line:rgba(255,255,255,.10); --hl:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --shadow:0 1px 0 rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.55);
  --shadow-lg:0 24px 70px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.06);
  --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.14); --hover:rgba(255,255,255,.05);
  --solid:#0E0E10; --solid-2:#141416; --solid-hover:#19191C; --seg-on:#3A3A3C;
  --fg:#F5F5F7; --muted:#98989D; --faint:#636366;
  --accent:#0A84FF; --accent-2:#409CFF; --accent-soft:rgba(10,132,255,.22); --accent-fg:#FFFFFF;
  --crit:#FF453A; --high:#FF9F0A; --med:#FFD60A; --low:#30D158; --info:#7D7AFF;
  --crit-soft:rgba(255,69,58,.18); --high-soft:rgba(255,159,10,.18); --med-soft:rgba(255,214,10,.16); --low-soft:rgba(48,209,88,.16);
  --paper:#1C1C1E; --paper-fg:#F5F5F7; --scrim:rgba(0,0,0,.55); --toast-bg:rgba(44,44,46,.92); --toast-fg:#F5F5F7;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;
  --amb-a:rgba(10,132,255,.16); --amb-b:rgba(100,210,255,.06); --amb-c:rgba(94,92,230,.09);
  --glass:rgba(255,255,255,.055); --glass-strong:rgba(28,28,30,.86);
  --sheen:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 40%);
  --glass-line:rgba(255,255,255,.10); --hl:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --shadow:0 1px 0 rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.55);
  --shadow-lg:0 24px 70px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.06);
  --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.14); --hover:rgba(255,255,255,.05);
  --solid:#0E0E10; --solid-2:#141416; --solid-hover:#19191C; --seg-on:#3A3A3C;
  --fg:#F5F5F7; --muted:#98989D; --faint:#636366;
  --accent:#0A84FF; --accent-2:#409CFF; --accent-soft:rgba(10,132,255,.22); --accent-fg:#FFFFFF;
  --crit:#FF453A; --high:#FF9F0A; --med:#FFD60A; --low:#30D158; --info:#7D7AFF;
  --crit-soft:rgba(255,69,58,.18); --high-soft:rgba(255,159,10,.18); --med-soft:rgba(255,214,10,.16); --low-soft:rgba(48,209,88,.16);
  --paper:#1C1C1E; --paper-fg:#F5F5F7; --scrim:rgba(0,0,0,.55); --toast-bg:rgba(44,44,46,.92); --toast-fg:#F5F5F7;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
/* ambient light field the glass refracts */
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60vw 50vh at 8% 0%,var(--amb-a),transparent 70%),
    radial-gradient(50vw 45vh at 100% 30%,var(--amb-b),transparent 70%),
    radial-gradient(55vw 50vh at 45% 105%,var(--amb-c),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accent-soft),0 0 0 1px var(--accent)!important}
.mono{font-family:var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
::selection{background:var(--accent-soft)}

/* glass material */
.rail,.panel,.kpi,.mk,.mp,.card,.drawer,.toast{
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}

.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100%}
.rail{margin:12px 0 12px 12px;background:var(--sheen),var(--glass);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--hl),var(--shadow);border-radius:26px;
  padding:18px 12px;display:flex;flex-direction:column;gap:22px;position:sticky;top:12px;height:calc(100vh - 24px);z-index:5}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(160deg,var(--accent-2),var(--accent));color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.01em;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 12px var(--accent-soft)}
.brand b{font-family:var(--f-display);font-weight:600;font-size:15px;display:block;letter-spacing:-.015em}
.brand small{color:var(--muted);font-size:11.5px;line-height:1.3;display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:8px 11px;border:0;background:none;border-radius:11px;text-align:left;color:var(--fg);font-weight:500;font-size:13.5px;transition:background .18s}
.nav button svg{color:var(--accent)}
.nav button:hover{background:var(--hover)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 14px var(--accent-soft)}
.nav button[aria-current="page"] svg{color:currentColor}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:600;background:var(--crit);color:#FFFFFF;min-width:20px;text-align:center;padding:1px 6px;border-radius:999px}
.nav button[aria-current="page"] .cnt{background:rgba(255,255,255,.25)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px;display:grid;gap:8px}
.demo-tag{display:inline-block;font-size:11px;font-weight:500;padding:3px 9px;border-radius:999px;color:var(--muted);background:var(--fill-2);width:max-content}

/* appearance switch (segmented control) */
.seg{display:inline-flex;padding:2px;border-radius:10px;background:var(--fill);gap:2px;width:100%}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:4px 6px;font-size:12px;font-weight:500;color:var(--fg);transition:background .18s,box-shadow .18s}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}

main{padding-block:28px 56px;padding-left:max(28px, env(safe-area-inset-left,0px));padding-right:max(28px, env(safe-area-inset-right,0px));min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1;margin:0;letter-spacing:-.025em;text-wrap:balance}
.head p{margin:6px 0 0;color:var(--muted);max-width:68ch;font-size:14px}

.btn{border:0;background:var(--fill);padding:7px 15px;border-radius:999px;font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--accent);transition:background .18s,transform .12s,filter .18s}
.btn svg{width:16px;height:16px}
.btn:hover{background:var(--fill-2);filter:brightness(.98)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 14px var(--accent-soft)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.sm{padding:4px 11px;font-size:12.5px}
.btn.ghost{background:none;color:var(--accent);padding-inline:8px}
.btn.ghost:hover{background:var(--accent-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.panel{background:var(--sheen),var(--glass);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--hl),var(--shadow);border-radius:var(--r-lg);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.panel-h h3{margin:0;font-family:var(--f-display);font-size:15px;font-weight:600;letter-spacing:-.015em}
.panel-h .sub{color:var(--muted);font-size:12px}
.panel-b{padding:14px 18px 16px}
.eyebrow{font-size:12px;color:var(--muted);font-weight:500}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--sheen),var(--glass);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--hl),var(--shadow);border-radius:var(--r-lg);padding:15px 17px;display:grid;gap:6px;position:relative;overflow:hidden}
.kpi .v{font-family:var(--f-display);font-size:32px;font-weight:600;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi .src{font-size:11px;color:var(--faint)}
.kpi.bad .v{color:var(--crit)}
.kpi.warn .v{color:var(--high)}
.kpi.bad::after,.kpi.warn::after{content:"";position:absolute;right:14px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--crit);box-shadow:0 0 0 4px var(--crit-soft)}
.kpi.warn::after{background:var(--high);box-shadow:0 0 0 4px var(--high-soft)}

.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;grid-auto-flow:dense}
.w4{grid-column:span 4}.w6{grid-column:span 6}.w8{grid-column:span 8}.w12{grid-column:span 12}

/* bars */
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,38%) minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:12.5px}
.bar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.bar .track{height:8px;background:var(--fill);border-radius:999px;overflow:hidden}
.bar .fill{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.c-crit{background:var(--crit)!important}.c-high{background:var(--high)!important}.c-med{background:var(--med)!important}.c-low{background:var(--low)!important}.c-info{background:var(--info)!important}

.cols{display:flex;align-items:flex-end;gap:8px;height:124px;padding-top:6px;border-bottom:1px solid var(--line)}
.cols .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.cols .c i{display:block;width:100%;max-width:30px;background:linear-gradient(180deg,var(--accent-2),var(--accent));border-radius:8px 8px 3px 3px;opacity:.45}
.cols .c i.last{opacity:1}
.cols .c span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cols-x{display:flex;gap:8px;margin-top:6px}
.cols-x span{flex:1;text-align:center;font-size:10.5px;color:var(--muted)}

.list{display:grid;gap:0}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center;font-size:13px}
.li:last-child{border-bottom:0}
.li .m{color:var(--muted);font-size:12px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--fill-2);color:var(--muted);border:0}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.high{background:var(--high-soft);color:var(--high)}
.chip.med{background:var(--med-soft);color:var(--med)}
.chip.low{background:var(--low-soft);color:var(--low)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.info{color:var(--info)}
.decide{margin:12px 16px;border:1px solid var(--accent-soft);border-radius:var(--r-md);background:var(--accent-soft);padding:14px 16px;display:grid;gap:12px}
.decide .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.decide label,.evform label{display:grid;gap:5px;font-size:12px;color:var(--muted);font-weight:500}
.note{padding:11px 14px;border:0;border-radius:var(--r-sm);background:var(--accent-soft);font-size:13px}
.clip{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.clip svg{width:13px;height:13px;flex:none}
.evform{display:grid;gap:10px}
.req{display:grid;grid-template-columns:minmax(0,1fr) 84px 20px;gap:8px;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.req small{display:block;color:var(--muted);font-size:11.5px}
.mark{font-weight:700;text-align:center}
.mark.ok{color:var(--low)}.mark.no{color:var(--crit)}
.cover{display:flex;gap:6px;flex-wrap:wrap}
input[type=file]{font-size:12.5px;max-width:100%}
input[type=file]::file-selector-button{border:0;background:var(--fill);color:var(--accent);border-radius:999px;padding:5px 12px;margin-right:10px;font:inherit;font-weight:500;cursor:pointer}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:transparent}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover td{background:var(--hover)}
td select,.field-form select,.field-form input,.inp{background:var(--fill);border:1px solid transparent;border-radius:9px;padding:6px 10px;min-width:0;transition:background .15s,box-shadow .15s}
td select:focus,.field-form select:focus,.field-form input:focus,.inp:focus{outline:none;background:var(--solid);box-shadow:0 0 0 3px var(--accent-soft),0 0 0 1px var(--accent)}
td select{font-size:12.5px;padding:4px 8px}

/* constructor */
.split{display:grid;grid-template-columns:224px minmax(0,1fr) 296px;gap:12px;align-items:start}
.reglist{display:grid;gap:3px;padding:8px}
.reglist button{border:0;background:none;text-align:left;padding:9px 11px;border-radius:12px;display:grid;gap:1px;transition:background .15s}
.reglist button:hover{background:var(--hover)}
.reglist button[aria-pressed="true"]{background:var(--accent-soft)}
.reglist button[aria-pressed="true"] b{color:var(--accent)}
.reglist b{font-weight:600;font-size:13px}
.reglist small{color:var(--muted);font-size:11.5px}
.tabs{display:flex;gap:2px;padding:2px;margin:12px 14px 2px;border-radius:11px;background:var(--fill);overflow-x:auto;width:fit-content;max-width:calc(100% - 28px)}
.tabs button{border:0;background:none;padding:6px 14px;color:var(--fg);font-weight:500;font-size:13px;border-radius:9px;white-space:nowrap;transition:background .18s,box-shadow .18s}
.tabs button[aria-selected="true"]{background:var(--seg-on);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
.type{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.field-form{display:grid;grid-template-columns:1.4fr 1fr 1.4fr 1.2fr auto;gap:8px;align-items:end;padding:14px 18px;border-top:1px solid var(--line);background:var(--fill-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.field-form label{display:grid;gap:5px;font-size:12px;color:var(--muted);font-weight:500}
.hint{font-size:12px;color:var(--muted)}
.role-ic{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.prev{display:grid;gap:10px}
.prev-card{border:0;border-radius:var(--r-md);padding:12px 14px;display:grid;gap:8px;background:var(--fill-2)}
.prev-card .ttl{font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.rule{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
.rule .k{font-size:11px;font-weight:600;color:var(--muted)}
.arrow{color:var(--faint)}

/* kanban */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:0;background:var(--fill);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:500;color:var(--fg);transition:background .15s}
.filters button:hover{background:var(--fill-2)}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.tasks-grid{display:grid;grid-template-columns:minmax(0,1fr) 304px;gap:12px;align-items:start}
.board{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--fill-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:260px;transition:background .15s,border-color .15s}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--fg);padding:4px 6px 6px}
.col-h > :last-child{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.card{background:var(--sheen),var(--glass-strong);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--hl),0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);border-radius:var(--r-md);padding:11px 12px;display:grid;gap:8px;cursor:grab;font-size:13px;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 var(--hl),0 8px 24px rgba(0,0,0,.10)}
.card:active{cursor:grabbing}
.card.dragging{opacity:.4}

/* docs */
.route{display:flex;align-items:center;gap:0}
.step{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-2);background:var(--solid)}

.link.done{background:var(--low)}
.doc-detail{display:grid;gap:14px}
.vsteps{display:grid;gap:0}

.vstep .step{margin-top:3px}

.vstep small{color:var(--muted);font-size:12px}
tr.sel td{background:var(--accent-soft)!important}
tr[data-doc]{cursor:pointer}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);background:var(--toast-bg);color:var(--toast-fg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);transform:translate(-50%,16px) scale(.96);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.3,1.2),opacity .2s;pointer-events:none;z-index:50;max-width:min(420px,calc(100vw - 40px));text-align:center}
.toast.on{transform:translate(-50%,0) scale(1);opacity:1}

/* task drawer: floating glass sheet */
.backdrop{position:fixed;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:30}
.drawer{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px, env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(540px,calc(100vw - 20px));background:var(--sheen),var(--glass-strong);border:1px solid var(--glass-line);border-radius:28px;z-index:31;display:flex;flex-direction:column;box-shadow:inset 0 1px 0 var(--hl),var(--shadow-lg);overflow:hidden}
.dr-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.dr-b{flex:1;overflow:auto;padding:16px 20px 24px;display:grid;gap:18px;align-content:start}
.dr-b label{display:grid;gap:5px;font-size:12px;color:var(--muted);font-weight:500}
.dr-b .inp{width:100%}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea.inp{min-height:90px;resize:vertical;font:inherit;line-height:1.45}
.cmt{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cmt .who{font-size:12px;color:var(--muted)}
.cmt .tx{white-space:pre-wrap;font-size:13px}
.hist{font-size:12px;color:var(--muted);display:grid;gap:4px}
.mailbox{border:0;border-radius:var(--r-md);background:var(--fill-2);padding:12px 14px;font-size:12.5px;display:grid;gap:4px}
.mailbox pre{margin:0;white-space:pre-wrap;font:inherit;max-height:170px;overflow:auto}

@media (max-width:560px){.fgrid{grid-template-columns:1fr}}

/* excel io */
.io{padding:12px 18px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.scan summary{cursor:pointer;font-size:13px;color:var(--muted)}
.scan summary b{color:var(--fg);font-weight:600}
.scan .tbl-wrap{margin-top:8px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--solid)}
.tbl-wrap td{max-width:340px}
.recs td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:7px 10px}
.recs th{padding:9px 10px;position:sticky;top:0;z-index:2;background:var(--solid-2)}
.recs-wrap{overflow:auto;border-top:1px solid var(--line);overscroll-behavior:contain;background:var(--solid);border-radius:0 0 var(--r-lg) var(--r-lg)}
.recs .pin{position:sticky;z-index:1;background:var(--solid)}

.split.rec-mode{grid-template-columns:minmax(0,1fr)}
.split.rec-mode > .panel:first-child,.split.rec-mode > .preview-col{display:none}
.split.rec-mode .io{padding-block:8px}

/* monitor screen: fixed single screen, sized in viewport units, nothing scrolls */
.mon{position:fixed;inset:0;z-index:40;background:
    radial-gradient(60vw 55vh at 5% 0%,var(--amb-a),transparent 70%),
    radial-gradient(50vw 50vh at 100% 100%,var(--amb-c),transparent 70%),
    var(--bg);
  display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:1.4vh;overflow:hidden;
  padding:calc(2.2vh + env(safe-area-inset-top,0px)) max(2vw, env(safe-area-inset-right,0px)) calc(1.4vh + env(safe-area-inset-bottom,0px)) max(2vw, env(safe-area-inset-left,0px));
  font-size:clamp(12px, calc(1.25vh + .35vw), 22px)}
.mon .eyebrow{font-size:.72em}
.mon-top{display:flex;justify-content:space-between;align-items:flex-end;gap:2vw}
.mon-top h1{font-family:var(--f-display);font-weight:700;font-size:1.9em;margin:0;line-height:1.1;letter-spacing:-.025em}
.mon-time{display:flex;align-items:baseline;gap:1.2vw}
.mon-date{color:var(--muted)}
.mon-clock{font-family:var(--f-display);font-weight:600;font-size:2.6em;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

.mk{background:var(--sheen),var(--glass);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--hl),var(--shadow);border-radius:1.4vw;padding:1.3vh 1.1vw;position:relative;overflow:hidden;display:grid;gap:.5vh}
.mk .l{color:var(--muted);font-size:.82em;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk .v{font-family:var(--f-display);font-weight:600;font-size:2.6em;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mk.bad .v{color:var(--crit)}.mk.warn .v{color:var(--high)}
.mk.bad::after,.mk.warn::after{content:"";position:absolute;right:1vw;top:1.3vh;width:.55em;height:.55em;border-radius:50%;background:var(--crit);box-shadow:0 0 0 .3em var(--crit-soft)}
.mk.warn::after{background:var(--high);box-shadow:0 0 0 .3em var(--high-soft)}
.mon-main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,3.3fr) minmax(0,3.7fr);gap:.9vw;min-height:0}
.mcol{display:grid;grid-template-rows:minmax(0,1.15fr) minmax(0,1fr);gap:.9vw;min-height:0}
.mp{background:var(--sheen),var(--glass);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--hl),var(--shadow);border-radius:1.4vw;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.mp-h{display:flex;justify-content:space-between;gap:1vw;padding:1.1vh 1.1vw;border-bottom:1px solid var(--line);font-family:var(--f-display);font-weight:600;font-size:.98em;letter-spacing:-.01em}
.mp-h .pg{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.85em}
.mp-b{padding:.6vh 1.1vw;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:5.4em minmax(0,1fr) auto;gap:.8vw;align-items:center;padding:.55vh 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.days{display:grid;justify-items:center;line-height:1.05;padding:.5vh .2em;border-radius:.7em;background:var(--fill-2)}
.days b{font-family:var(--f-display);font-weight:600;font-size:1.55em;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.days span{font-size:.58em;color:var(--muted);text-align:center;white-space:nowrap}
.days.over{background:var(--crit-soft)}.days.over b{color:var(--crit)}
.days.soon{background:var(--high-soft)}.days.soon b{color:var(--high)}
.t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t1 span{color:var(--muted);font-weight:400}
.t2{font-size:.8em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr{display:grid;justify-items:end;gap:.3vh;font-size:.8em;color:var(--muted)}
.mon .chip{font-size:.78em}
.mon .bars{gap:1vh}
.mon .bar{font-size:.9em;grid-template-columns:minmax(0,40%) minmax(0,1fr) 2.6em}
.mon .bar .track{height:1.1vh;min-height:8px}
.mdates{margin-top:1.4vh;display:grid;gap:.2vh}
.md{display:grid;grid-template-columns:6.5em minmax(0,1fr) auto;gap:.6vw;font-size:.85em;padding:.45vh 0;border-top:1px solid var(--line)}
.md .neg{color:var(--crit);font-weight:600}.md .warn{color:var(--high);font-weight:600}
.pdots{display:flex;gap:6px;justify-content:center;padding:.8vh 0}
.pdots i{width:7px;height:7px;border-radius:999px;background:var(--line-2);transition:width .3s,background .3s}
.pdots i.on{background:var(--accent);width:18px}
.mon-foot{display:flex;justify-content:space-between;gap:2vw;color:var(--muted);font-size:.75em;white-space:nowrap;overflow:hidden}
.mon-foot span{overflow:hidden;text-overflow:ellipsis}
@media (max-width:860px){
  .mon{position:fixed;overflow:auto;grid-template-rows:auto;font-size:14px}
  .mon-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}

}

.me-t{display:grid;min-width:0;gap:1px}
.me-t .hint{font-size:10.5px;line-height:1.2}
.me select{border:0;background:none;font-weight:600;font-size:13px;padding:0;color:var(--fg);max-width:100%;cursor:pointer}
.me small{font-size:11px;line-height:1.3;white-space:normal}
/* monitor controls */
.mon-ctl{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 3.4vh);transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;background:var(--sheen),var(--glass-strong);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--hl),var(--shadow-lg);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);z-index:45;transition:opacity .4s,transform .4s;font-size:14px}
.mon-ctl button{width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--fg);display:grid;place-items:center;transition:background .15s,transform .12s}
.mon-ctl button:hover{background:var(--hover)}
.mon-ctl button:active{transform:scale(.92)}
.mon-ctl button svg{width:20px;height:20px}
.mon-ctl button.main{background:var(--accent);color:var(--accent-fg);box-shadow:0 4px 14px var(--accent-soft)}
.mon-ctl button.main:hover{filter:brightness(1.08);background:var(--accent)}
.mon-ctl button.x:hover{background:var(--crit-soft);color:var(--crit)}
.mon-pg{display:grid;gap:5px;justify-items:center;padding:0 10px;font-size:12px;color:var(--muted)}
.mon-prog{width:64px;height:3px;border-radius:3px;background:var(--fill);overflow:hidden}
.mon-prog i{display:block;height:100%;background:var(--accent);transform-origin:left;animation:monprog linear forwards}
.mon-prog.paused i{animation-play-state:paused;background:var(--faint)}
@keyframes monprog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
body.mon-idle .mon-ctl{opacity:0;pointer-events:none;transform:translate(-50%,12px)}
body.mon-idle .mon{cursor:none}
@media (max-width:860px){
  .recform{grid-template-columns:1fr}
  .cat-add.user-add,.cat-add.fld-add,.tpl-form{grid-template-columns:1fr}
  .rail-foot{display:flex;margin:0 0 0 auto;padding:0}
  .rail-foot > :not(#me-box){display:none}
  .me{padding:4px 10px 4px 4px;white-space:nowrap}
  .me small,.me-t .hint{display:none}

/* ---------- scanner report import (Excel) ---------- */
const scans=[];
function scoreOf(cvss,exp,fix){
  if(cvss==null||cvss==='')return null;
  const x=+cvss*(exp==='Есть, эксплуатируется'?1:exp==='Есть'?0.94:0.91)*((!fix||fix==='Исправление не выпущено')?1:0.95);
  return Math.ceil(Math.round(x*1e6)/1e5)/10;
}
function critOf(s){return s==null?'Высокая':s>=9?'Критическая':s>=7?'Высокая':s>=4?'Средняя':'Низкая'}
function importScan({date,dept,hosts,rows}){
  const r=reg('vuln');
  const os=[...new Set(hosts.map(h=>String(h[2]||'').split(' ')[0]).filter(Boolean))].join('/')||'ПК';
  const report=os+' · '+dept+' · '+fmt(date);
  const fRep=r.fields.find(f=>f.key==='report');if(!fRep.options.includes(report))fRep.options.push(report);
  const fPkg=r.fields.find(f=>f.key==='pkg');
  let added=0,dup=0;
  rows.forEach(x=>{
    const [pkg,cve,level,cvss,exploit,vector,fix,desc,hits]=x;if(!cve)return;
    if(pkg&&!fPkg.options.includes(pkg))fPkg.options.push(pkg);
    const ex=r.records.find(z=>z.title===cve&&z.pkg===pkg&&!closed(r,z));
    if(ex){ex.hits=Math.max(+ex.hits||0,+hits||0);dup++;return}
    const score=scoreOf(cvss,exploit,fix);
    r.records.push({id:uid++,title:cve,pkg,level,cvss:cvss??'',exploit,vector:vector||'',score:score??'',crit:critOf(score),hits:+hits||0,fix:fix||'',desc:desc||'',report,notified:new Date(date),status:'Открыта',comment:'',measures:'',newDue:null,owner:''});added++;
  });
  const prev=scans.find(s=>s.report===report);
  if(prev){prev.count=Math.max(prev.count,added+dup);if(hosts.length)prev.hosts=hosts}
  else scans.push({report,dept,date:new Date(date),hosts,count:added+dup});
  return {added,dup,report};
}

function addWork(n){let x=new Date(today),c=0;while(c<n){x=new Date(x.getTime()+DAY);if(x.getDay()%6)c++}return x}
function parseMail(raw){
  const get=re=>{const m=raw.match(re);return m?m[2].trim():''};
  const from=get(/^(От|From|Отправитель)\s*:\s*(.+)$/im),subj=get(/^(Тема|Subject)\s*:\s*(.+)$/im),sent=get(/^(Отправлено|Дата|Date|Sent)\s*:\s*(.+)$/im);
  const body=raw.split(/\r?\n/).filter(l=>!/^(От|From|Отправитель|Тема|Subject|Отправлено|Дата|Date|Sent|Кому|To|Копия|Cc)\s*:/i.test(l)).join('\n').trim();
  const title=(subj||body.split(/[.!?\n]/)[0]||'Задача из письма').replace(/^((RE|FW|FWD|Ответ|Пересл\.?|ПЕРЕСЛ)\s*:\s*)+/i,'').trim().slice(0,140);
  const text=(subj+' \n'+body).toLowerCase();
  let due,dueWhy,m;
  if((m=text.match(/до\s+(\d{1,2})[.\/](\d{1,2})(?:[.\/](\d{2,4}))?/))){let y=m[3]?+m[3]:today.getFullYear();if(y<100)y+=2000;due=new Date(y,+m[2]-1,+m[1]);dueWhy='в письме: «'+m[0]+'»'}
  else if(/сегодня/.test(text)){due=new Date(today);dueWhy='в письме: «сегодня»'}
  else if(/завтра/.test(text)){due=d(1);dueWhy='в письме: «завтра»'}
  else if((m=text.match(/в течение\s+(\d+)\s*(рабоч\S*\s*)?(дн|день|дней)/))){due=m[2]?addWork(+m[1]):d(+m[1]);dueWhy='в письме: «'+m[0]+'»'}
  else{due=addWork(3);dueWhy='срок в письме не найден, по умолчанию 3 рабочих дня'}
  const urgent=/срочно|немедленно|asap|критич/.test(text);
  if(urgent&&!/^в письме/.test(dueWhy)){due=addWork(1);dueWhy+='; «срочно» → 1 рабочий день'}
  let best=null;mailRules.forEach(r=>{const hits=r.kw.filter(k=>text.includes(k));if(hits.length&&(!best||hits.length>best.hits.length))best={...r,hits}});
  return {from,subj,sent,body,title,due,dueWhy,prio:urgent?'Высокий':'Обычный',cat:best?best.cat:'Без категории',owner:best?best.owner:people[0],hits:best?best.hits:[]};
}

function reg(id){return registers.find(r=>r.id===id)}
function fval(r,rec,f){
  if(f.type==='calc'&&f.rule.override&&rec[f.rule.override] instanceof Date)return rec[f.rule.override];
  if(f.type==='calc'){const b=rec[f.rule.from],n=f.rule.days[rec[f.rule.by]];return (b&&n!=null)?new Date(b.getTime()+n*DAY):null}
  return rec[f.key];
}
function closed(r,rec){const s=r.fields.find(f=>f.closed);return s?s.closed.includes(rec[s.key]):false}
function dlState(r,rec){
  const f=r.fields.find(f=>f.analytics==='deadline');if(!f)return null;
  if(closed(r,rec))return 'closed';
  const v=fval(r,rec,f);if(!v)return null;
  const n=diff(v);return n<0?'overdue':n<=7?'soon':'ok';
}
function docReview(doc){if(!doc.approved)return null;const x=new Date(doc.approved);x.setMonth(x.getMonth()+doc.reviewMonths);return x}
function docState(doc){
  if(doc.stage<routeTpl.length)return {k:'route',t:'На согласовании',c:'acc'};
  const n=diff(docReview(doc));
  if(n<0)return {k:'over',t:'Пересмотр просрочен',c:'crit'};
  if(n<=45)return {k:'soon',t:'Пересмотр через '+n+' дн.',c:'high'};
  return {k:'ok',t:'Актуален',c:'low'};
}
function chipFor(v){const c=critClass[v];return c?`<span class="chip ${c}"><span class="dot"></span>${esc(v)}</span>`:esc(v)}
function dlChip(s,v){
  if(s==='overdue')return `<span class="chip crit">Просрочено ${-diff(v)} дн.</span>`;
  if(s==='soon')return `<span class="chip high">Осталось ${diff(v)} дн.</span>`;
  if(s==='closed')return `<span class="chip">Закрыто</span>`;
  if(s==='ok')return `<span class="chip low">В срок · ${diff(v)} дн.</span>`;
  return '—';
}

/* ---------- widgets from analytics fields ---------- */
function bars(rows,colorFn){
  const max=Math.max(1,...rows.map(r=>r[1]));
  return `<div class="bars">${rows.map(([t,n])=>`<div class="bar"><span class="t" title="${esc(t)}">${esc(t)}</span><span class="track"><span class="fill ${colorFn?colorFn(t):''}" style="width:${n/max*100}%"></span></span><span class="n">${n}</span></div>`).join('')}</div>`;
}
const critColor=t=>critClass[t]?'c-'+critClass[t]:'';
function widgetsFor(r){
  const out=[];
  r.fields.forEach(f=>{
    if(f.analytics==='dimension'){
      const opts=f.options||[...new Set(r.records.map(x=>x[f.key]))];
      const rows=opts.map(o=>[o,r.records.filter(x=>x[f.key]===o).length]);
      const empty=r.records.filter(x=>!x[f.key]).length;if(empty)rows.push(['Не заполнено',empty]);
      out.push({title:f.label,kind:'Распределение',html:bars(rows,critColor),field:f});
    }else if(f.analytics==='metric'){
      const vals=r.records.map(x=>+x[f.key]).filter(v=>!isNaN(v));
      const avg=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length):0;
      const mx=vals.length?Math.max(...vals):0;
      out.push({title:f.label,kind:'Показатель',field:f,html:`<div class="row" style="gap:24px"><div><div class="eyebrow">Среднее</div><div class="mono" style="font-size:26px">${avg.toFixed(1)}</div></div><div><div class="eyebrow">Максимум</div><div class="mono" style="font-size:26px">${mx.toFixed(1)}</div></div><div><div class="eyebrow">Записей</div><div class="mono" style="font-size:26px">${vals.length}</div></div></div>`});
    }else if(f.analytics==='date'){
      const weeks=[];for(let i=7;i>=0;i--){const from=d(-7*i-6),to=d(-7*i);weeks.push({from,to,n:r.records.filter(x=>x[f.key]&&x[f.key]>=from&&x[f.key]<=new Date(to.getTime()+DAY-1)).length})}
      const mx=Math.max(1,...weeks.map(w=>w.n));
      out.push({title:f.label+' — по неделям',kind:'Динамика',field:f,html:`<div class="cols">${weeks.map((w,i)=>`<div class="c"><span>${w.n||''}</span><i class="${i===7?'last':''}" style="height:${w.n/mx*88}%"></i></div>`).join('')}</div><div class="cols-x">${weeks.map((w,i)=>`<span>${i===7?'тек.':String(w.from.getDate()).padStart(2,'0')+'.'+String(w.from.getMonth()+1).padStart(2,'0')}</span>`).join('')}</div>`});
    }else if(f.analytics==='deadline'){
      const st=r.records.map(x=>({x,s:dlState(r,x),v:fval(r,x,f)}));
      const over=st.filter(z=>z.s==='overdue').sort((a,b)=>a.v-b.v),soon=st.filter(z=>z.s==='soon').sort((a,b)=>a.v-b.v);
      const list=[...over,...soon].slice(0,6);

}

  const docColor=t=>({'Актуален':'c-low','Скоро пересмотр':'c-high','Просрочен':'c-crit','На согласовании':''})[t];

  return `
  <div class="head"><div><h1>Дашборд отдела ИБ</h1><p>Виджеты строятся сами из полей реестров, помеченных для аналитики. Отметьте новое поле в конструкторе, и здесь появится график.</p></div>
   <div class="row"><button class="btn" data-nav="monitor">${icons.monitor} Экран мониторинга</button></div></div>

   ${kpi(overV,'Уязвимости с просроченным сроком','поле «Срок устранения»',overV?'bad':'')}
   ${kpi(inc30,'Инциденты за 30 дней','реестр инцидентов')}
   ${kpi(overT,'Просроченные задачи','раздел «Задачи»',overT?'warn':'')}
   ${kpi(docRev,'Документы к пересмотру','раздел «Документы»',docRev?'warn':'')}
   ${kpi(pend,'Риски ИБ без решения ОУР','реестр рисков ИБ',pend?'warn':'')}
  </div>
  <div class="dash">
   ${regPanels}
   <section class="panel w4"><div class="panel-h"><h3>Открытые задачи по категориям</h3><span class="sub">Задачи</span></div><div class="panel-b">${bars(bySrc,srcBar)}</div></section>
   <section class="panel w4"><div class="panel-h"><h3>Оперплан</h3><span class="sub">IV квартал</span></div><div class="panel-b"><div class="list">${opplan.map(o=>`<div class="li" style="grid-template-columns:1fr"><div><div class="row" style="justify-content:space-between"><span>${esc(o.name)}</span><span class="mono m">${o.done}%</span></div><div class="progress"><i style="width:${o.done}%"></i></div></div></div>`).join('')}</div></div></section>
   <section class="panel w4"><div class="panel-h"><h3>Актуальность документов</h3><span class="sub">Документы</span></div><div class="panel-b">${bars(docRows,docColor)}</div></section>
   <section class="panel w4"><div class="panel-h"><h3>Доказательная база</h3><span class="sub">Доказательства</span></div><div class="panel-b">${bars(['Принято','На проверке','Истекает','Истекло','Отклонено'].map(s=>[s,evidence.filter(e=>evState(e)===s).length]),t=>({'Принято':'c-low','Истекает':'c-high','Истекло':'c-crit','Отклонено':'c-crit'})[t]||'')}</div></section>
  </div>`;
}

/* ---------- constructor ---------- */
const typeNames={text:'Текст',select:'Список',number:'Число',date:'Дата',user:'Сотрудник',decision:'Решение другого отдела',calc:'Вычисляемое'};
const roleNames={'':'Не используется',dimension:'Группировка (график)',metric:'Показатель (среднее, максимум)',date:'Динамика по датам',deadline:'Контроль сроков'};
const roleShort={dimension:'группировка',metric:'показатель',date:'динамика',deadline:'сроки'};

function viewBuilder(){
  const r=reg(S.reg);
  const ws=widgetsFor(r);
  const tab=S.tab;
  let body='';
  if(tab==='fields'){
    body=`<div class="tbl-wrap"><table><thead><tr><th>Поле</th><th>Тип</th><th>Значения / правило</th><th>Для аналитики</th></tr></thead><tbody>
    ${r.fields.map((f,i)=>`<tr><td><b style="font-weight:500">${esc(f.label)}</b></td><td><span class="type">${typeNames[f.type]}</span></td>
      <td class="hint">${f.type==='decision'?esc(f.options.join(', '))+' · <b style="font-weight:500;color:var(--accent)">сохраняется только с документом-основанием</b>':f.type==='select'?esc(f.options.join(', ')):f.type==='calc'?'«'+esc(r.fields.find(x=>x.key===f.rule.from).label)+'» + '+Object.entries(f.rule.days).map(([k,v])=>k.toLowerCase()+' '+v+' дн.').join(', '):f.type==='user'?'Справочник сотрудников':'—'}</td>
      <td><select data-role="${i}" aria-label="Аналитика для поля ${esc(f.label)}">${Object.entries(roleNames).filter(([k])=>k===''||allowedRoles(f).includes(k)).map(([k,t])=>`<option value="${k}" ${(f.analytics||'')===k?'selected':''}>${t}</option>`).join('')}</select></td></tr>`).join('')}
    </tbody></table></div>
    <form class="field-form" id="ff">
      <label>Название поля<input id="ff-label" class="inp" required placeholder="Например: Источник выявления"></label>
      <label>Тип<select id="ff-type">${Object.entries(typeNames).filter(([k])=>k!=='calc').map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select></label>
      <label>Значения списка (через запятую)<input id="ff-opts" class="inp" placeholder="Сканер, Пентест, Аудит, ДИКТ"></label>
      <label>Для аналитики<select id="ff-role">${Object.entries(roleNames).filter(([k])=>k!=='deadline').map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select></label>
      <button class="btn primary" type="submit">Добавить поле</button>
    </form>`;
  }else if(tab==='records'){
    const dlf=r.fields.find(f=>f.analytics==='deadline');
    const cols=[r.fields[0],...(dlf?[{key:'__dl',label:'Дней до срока',virt:true}]:[]),...r.fields.slice(1)];
    const q=(S.q||'').toLowerCase();
    const ord={overdue:0,soon:1,ok:2,closed:3,null:4};
    const dts=rec=>{const v=dlf&&fval(r,rec,dlf);return v?v.getTime():Infinity};
    const recs=r.records.filter(rec=>!q||r.fields.some(f=>{const v=fval(r,rec,f);return String(v instanceof Date?fmt(v):(v??'')).toLowerCase().includes(q)}))
      .sort((a,b)=>(ord[dlState(r,a)]-ord[dlState(r,b)])||(dts(a)-dts(b)));
    const cell=(rec,f)=>{if(f.virt)return dlChip(dlState(r,rec),fval(r,rec,dlf));const v=fval(r,rec,f);
      return v instanceof Date?`<span class="mono">${fmt(v)}</span>`:f.type==='number'?`<span class="mono">${v??''}</span>`:f.type==='decision'?decCell(rec,f):f.type==='select'?(v?chipFor(v):'—'):`<span title="${esc(v||'')}">${esc(v||'—')}</span>`};
    body=ioBar(r)+decideForm(r)+`<div class="rec-tools">
      <input id="rec-q" class="inp" type="search" placeholder="Поиск по реестру: CVE, пакет, описание…" value="${esc(S.q||'')}" aria-label="Поиск по реестру">
      <label class="hint" for="rec-pin">Закрепить столбцов</label>
      <select id="rec-pin" class="inp">${[0,1,2,3,4].map(n=>`<option value="${n}" ${S.pin===n?'selected':''}>${n===0?'нет':n+': '+cols.slice(0,n).map(c=>c.label).join(', ')}</option>`).join('')}</select>
      <span class="hint mono">${recs.length} из ${r.records.length}</span><button class="btn primary sm" data-recnew="1">Новая запись</button></div>
    <div class="tbl-wrap recs-wrap" id="recs-wrap"><table class="recs" data-pin="${S.pin}"><thead><tr>${cols.map(f=>`<th>${esc(f.label)}</th>`).join('')}</tr></thead><tbody>
    ${recs.map(rec=>`<tr data-rec="${rec.id}" title="Открыть карточку записи">${cols.map(f=>`<td>${cell(rec,f)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}" class="hint">Ничего не найдено</td></tr>`}
    </tbody></table></div>`;
  }else{
    const dateFields=r.fields.filter(f=>f.type==='date'||f.type==='calc');
    const selFields=r.fields.filter(f=>f.type==='select'||f.type==='decision');
    body=`<div class="panel-b"><div class="list">${r.automations.map((a,i)=>`<div class="rule"><span class="k">Когда</span><span>${esc(a.when)}</span><span class="k">Тогда</span><span class="row" style="justify-content:space-between">${esc(a.then)}<button class="btn ghost sm" data-delrule="${i}">Удалить</button></span></div>`).join('')}</div></div>
    <form class="field-form" id="rf" style="grid-template-columns:1.2fr 1.2fr .6fr 1.4fr auto">
      <label>Условие<select id="rf-trig">
        ${dateFields.map(f=>`<option value="before|${f.label}">За N дней до «${esc(f.label)}»</option><option value="over|${f.label}">«${esc(f.label)}» просрочен</option>`).join('')}
        ${selFields.map(f=>f.options.map(o=>`<option value="eq|${f.label}|${o}">«${esc(f.label)}» = ${esc(o)}</option>`).join('')).join('')}
      </select></label>
      <label>Действие<select id="rf-act"><option>Уведомить ответственного</option><option>Создать задачу ответственному</option><option>Эскалация начальнику ИБ</option><option>Сменить статус на «В работе»</option></select></label>
      <label>N дней<input id="rf-n" class="inp" type="number" value="3" min="1"></label>
      <label>Кому<select id="rf-who"><option>Ответственный записи</option>${people.map(p=>`<option>${p}</option>`).join('')}<option>ДИКТ</option></select></label>
      <button class="btn primary" type="submit">Добавить правило</button>
    </form>`;
  }

  return `
  <div class="head"><div><h1>Конструктор реестров</h1><p>Реестр собирается из полей. У поля можно включить аналитику, тогда по нему появляется виджет на дашборде. На вкладке «Автоматизация» задаются правила: когда наступает событие, что сделать.</p></div></div>
  <div class="split ${tab==='records'?'rec-mode':''}">
    <div class="panel"><div class="panel-h"><h3>Реестры</h3></div>
      <div class="reglist">${registers.map(x=>`<button data-reg="${x.id}" aria-pressed="${x.id===S.reg}"><b>${esc(x.name)}</b><small>${x.fields.length} полей · ${x.records.length} записей</small></button>`).join('')}</div>
      <form id="nr" style="padding:8px 12px 12px;display:grid;gap:6px;border-top:1px solid var(--line)"><input id="nr-name" class="inp" placeholder="Новый реестр, например: Реестр доступов" required><button class="btn sm" type="submit">Создать реестр</button></form>
    </div>
    <div class="panel">
      <div class="panel-h"><div><h3>${esc(r.name)}</h3><span class="sub">Владелец: ${esc(r.owner)}</span></div>${tab==='records'?`<select id="reg-sel" class="inp" aria-label="Другой реестр">${registers.map(x=>`<option value="${x.id}" ${x.id===r.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}</div>
      ${r.id==='risk'?`<div style="padding:12px 16px 2px"><div class="note">Реестр ведётся отдельно от реестра операционных рисков банка. С реестром ОУР он связан только номером риска. Принятие, снижение или передачу риска решает Отдел управления рисками. ИБ фиксирует это решение на портале, и сохранить его можно только с приложенным документом ОУР.</div></div>`:''}
      <div class="tabs" role="tablist">${[['fields','Поля'],['records','Записи'],['auto','Автоматизация']].map(([k,t])=>`<button role="tab" data-tab="${k}" aria-selected="${tab===k}">${t}${k==='auto'?` <span class="chip" style="margin-left:4px">${r.automations.length}</span>`:''}</button>`).join('')}</div>
      ${body}
    </div>
    <div class="panel preview-col"><div class="panel-h"><h3>Попадёт на дашборд</h3><span class="sub">${ws.length} виджет.</span></div>
      <div class="panel-b prev">${ws.length?ws.map(w=>`<div class="prev-card"><div class="ttl"><span>${esc(w.title)}</span><span class="role-ic">${roleShort[w.field.analytics]}</span></div>${w.kind==='Распределение'?w.html:`<div class="hint">${w.kind}: ${esc(w.field.label)}</div>`}</div>`).join(''):'<div class="hint">Ни одно поле не отмечено для аналитики. Выберите роль в колонке «Для аналитики».</div>'}</div>
    </div>
  </div>${tab==='records'?recDrawer(r):''}`;
}
function allowedRoles(f){return ({select:['dimension'],decision:['dimension'],user:['dimension'],number:['metric'],date:['date','deadline'],calc:['deadline','date'],text:[]})[f.type]||[]}

/* ---------- tasks ---------- */
const cols=[['new','Новые'],['work','В работе'],['review','На проверке'],['done','Готово']];
const srcCls={'Почта':'src-mail','Проект':'src-proj','Оперплан':'src-op','Реестр':'src-reg'};
function taskDrawer(){
  const t=findTask(S.task);if(!t)return '';
  const opt=(arr,v)=>arr.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${val===v?'selected':''}>${esc(lab)}</option>`}).join('');
  return `<div class="backdrop" data-close="1"></div><aside class="drawer" role="dialog" aria-label="Задача">
   <div class="dr-h"><div><div class="eyebrow">Задача #${t.id} · ${t.source}</div><b style="font-weight:600">${esc(t.title)}</b></div><button class="btn sm" data-close="1">Закрыть</button></div>
   <div class="dr-b">
    <form id="tkf" style="display:grid;gap:10px">
     <label>Название<input id="tk-title" class="inp" value="${esc(t.title)}" required></label>
     <label>Описание<textarea id="tk-desc" class="inp" placeholder="Что нужно сделать, критерий готовности">${esc(t.desc)}</textarea></label>
     <div class="fgrid">
      <label>Статус<select id="tk-status" class="inp">${opt(cols,t.status)}</select></label>
      <label>Ответственный<select id="tk-owner" class="inp">${opt(withCur(people,t.owner),t.owner)}</select></label>
      <label>Срок<input id="tk-due" class="inp" type="date" value="${isoD(t.due)}"></label>
      <label>Приоритет<select id="tk-prio" class="inp">${opt(withCur(prios,t.prio),t.prio)}</select></label>
      <label>Категория<select id="tk-src" class="inp">${opt(withCur(taskSrc,t.source),t.source)}</select></label>
     </div>
     <div class="row"><button class="btn primary" type="submit">Сохранить</button>${t.status!=='done'?`<button class="btn" type="button" data-done="${t.id}">Отметить выполненной</button>`:''}</div>
    </form>
    ${t.mail?`<div class="mailbox"><div class="eyebrow">Исходное письмо</div><div><b style="font-weight:500">${esc(t.mail.subj||'(без темы)')}</b></div><div class="hint">${esc(t.mail.from||'отправитель не указан')}${t.mail.sent?' · '+esc(t.mail.sent):''}</div><pre>${esc(t.mail.body)}</pre></div>`:''}
    <div><div class="eyebrow" style="margin-bottom:4px">Комментарии · ${t.comments.length}</div>
     ${t.comments.map(c=>`<div class="cmt"><span class="av">${ini(c.who)}</span><div><div class="who">${esc(c.who)} · ${fmtT(c.at)}</div><div class="tx">${esc(c.text)}</div></div></div>`).join('')||'<div class="hint">Комментариев пока нет</div>'}
     <form id="tcf" style="display:grid;gap:8px;margin-top:10px"><textarea id="tc-text" class="inp" style="min-height:64px" placeholder="Написать комментарий: что сделано, что мешает" required></textarea><div><button class="btn sm" type="submit">Добавить комментарий</button></div></form>
    </div>
    <div><div class="eyebrow" style="margin-bottom:4px">История изменений</div><div class="hist">${t.history.slice().reverse().map(h=>`<div>${fmtT(h.at)} · ${esc(h.who)}: ${esc(h.text)}</div>`).join('')}</div></div>
    ${taskActions(t)}
   </div></aside>`;
}

  const md=S.mailDraft;if(!md)return '';

  return `<div class="backdrop" data-close="1"></div><aside class="drawer" role="dialog" aria-label="Задача из письма">
   <div class="dr-h"><div><div class="eyebrow">Почта → задача</div><b style="font-weight:600">Задача из письма</b></div><button class="btn sm" data-close="1">Закрыть</button></div>
   <div class="dr-b">
    <form id="mpf" style="display:grid;gap:8px">

     <label>Название<input id="mc-title" class="inp" value="${esc(p.title)}" required></label>
     <div class="fgrid">
      <label>Ответственный<select id="mc-owner" class="inp">${people.map(x=>`<option ${x===p.owner?'selected':''}>${x}</option>`).join('')}</select><span class="why">Категория «${esc(p.cat)}»${p.hits.length?' по словам: '+esc(p.hits.join(', ')):''}</span></label>
      <label>Срок<input id="mc-due" class="inp" type="date" value="${isoD(p.due)}"><span class="why">${esc(p.dueWhy)}</span></label>
      <label>Приоритет<select id="mc-prio" class="inp">${withCur(prios,p.prio).map(x=>`<option ${x===p.prio?'selected':''}>${esc(x)}</option>`).join('')}</select></label>
      <label>Отправитель<input class="inp" value="${esc(p.from||'—')}" readonly></label>
     </div>
     <label>Описание (текст письма)<textarea id="mc-desc" class="inp">${esc(p.body)}</textarea></label>
     <div><button class="btn primary" type="submit">Создать задачу</button></div>
    </form>`:''}

function viewTasks(){
  tasks.forEach(normTask);taskArchive.forEach(normTask);
  const f=S.srcFilter;
  const list=(S.taskArch?taskArchive:tasks).filter(t=>f==='Все'||t.source===f);
  const card=t=>{const n=diff(t.due);const late=t.status!=='done'&&n<0;return `<article class="card${S.taskArch?' arch':''}" draggable="${S.taskArch?'false':'true'}" data-task="${t.id}" tabindex="0" aria-label="Открыть задачу ${esc(t.title)}"><div>${t.prio==='Высокий'?'<span class="chip crit" style="margin-right:6px">срочно</span>':''}${esc(t.title)}</div><div class="meta"><span class="${srcTone(t.source)}">● ${esc(t.source)}</span><span class="mono" style="${late?'color:var(--crit);font-weight:500':''}">${late?'просрочено · ':''}${fmt(t.due)}</span></div><div class="meta"><span class="row" style="gap:6px"><span class="av">${ini(t.owner)}</span>${esc(t.owner)}</span><span class="row" style="gap:6px">${t.comments.length?`<span class="clip" title="Комментарии">${cmtIc}${t.comments.length}</span>`:''}${t.fromRec?'<span class="chip crit">авто</span>':''}</span></div></article>`};
  return `
  <div class="head"><div><h1>Задачи</h1><p>Почта, проекты, оперплан и автоматизации реестров попадают на одну доску. Нажмите на карточку, чтобы изменить её или прокомментировать. Перетащите карточку, чтобы сменить статус.</p></div>
   <div class="row"><button class="btn primary" data-act="mail-new">Задача из письма</button><div class="filters">${['Все',...catItems('src').filter(x=>x.active||tasks.some(t=>t.source===x.v)).map(x=>x.v)].map(s=>`<button data-src="${esc(s)}" aria-pressed="${f===s}">${esc(s)} <span class="mono">${s==='Все'?tasks.length:tasks.filter(t=>t.source===s).length}</span></button>`).join('')}<button data-tarch="1" class="arch-btn" aria-pressed="${!!S.taskArch}">Архив <span class="mono">${taskArchive.length}</span></button></div></div></div>
  ${taskDrawer()}${mailDrawer()}${S.taskArch?`<div class="note arch-note">Показаны задачи в архиве: ${taskArchive.length}. Откройте карточку, чтобы вернуть задачу на доску. Чтобы выйти из архива, нажмите «Архив» ещё раз.</div>`:''}
  <form class="quick" id="qt">
    <input id="qt-title" class="inp" placeholder="Новая задача, например: Проверить права в АБС после увольнения" required>
    <select id="qt-src" class="inp" aria-label="Категория">${catItems('src').filter(x=>x.active&&!x.auto).map(x=>`<option>${esc(x.v)}</option>`).join('')}</select>
    <select id="qt-owner" class="inp" aria-label="Ответственный">${people.map(p=>`<option>${p}</option>`).join('')}</select>
    <input id="qt-due" class="inp" type="date" aria-label="Срок" value="${isoD(d(5))}">
    <button class="btn primary" type="submit">Назначить</button>

  ${sc.map(s=>`<details class="scan"><summary><b>${esc(s.report)}</b> · хостов: ${s.hosts.length} · уязвимостей в отчёте: ${s.count}</summary><div class="tbl-wrap"><table><thead><tr><th>Хост</th><th>IP-адрес</th><th>ОС</th></tr></thead><tbody>${s.hosts.map(h=>`<tr><td class="mono">${esc(h[0])}</td><td class="mono">${esc(h[1])}</td><td>${esc(h[2])}</td></tr>`).join('')}</tbody></table></div></details>`).join('')}</div>`;

function parseRu(s){const m=String(s).trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);return m?new Date(+m[3],+m[2]-1,+m[1]):null}
async function handleImport(file){
  if(typeof XLSX==='undefined'){toast('Модуль Excel не загрузился, обновите страницу');return}
  let wb;try{wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true})}catch(e){toast('Не удалось прочитать файл. Нужна книга Excel (.xlsx)');return}
  const sheets=wb.SheetNames.map(n=>({n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null})}));
  const vs=sheets.find(s=>s.rows[0]&&s.rows[0].includes('CVE')&&s.rows[0].includes('Пакет'));
  if(vs){
    const H=vs.rows[0],ix=k=>H.indexOf(k),g=(x,k)=>ix(k)<0?null:x[ix(k)];
    const rows=vs.rows.slice(1).filter(x=>g(x,'CVE')).map(x=>[g(x,'Пакет'),g(x,'CVE'),g(x,'Уровень'),g(x,'CVSS'),g(x,'Эксплойт'),g(x,'Сетевой вектор'),g(x,'Обновить до версии'),g(x,'Краткое описание'),g(x,'Обнаружений')]);
    let dept='—',hosts=[];const hs=sheets.find(s=>s.n==='Хосты');
    if(hs){dept=(hs.rows[0]&&hs.rows[0][0])||dept;const hi=hs.rows.findIndex(x=>x&&x.includes('Имя хоста'));if(hi>=0){const c=hs.rows[hi];hosts=hs.rows.slice(hi+1).filter(x=>x[c.indexOf('Имя хоста')]).map(x=>[x[c.indexOf('Имя хоста')],x[c.indexOf('IP-адрес')],x[c.indexOf('ОС')]])}}
    const m=file.name.match(/(\d{4})-(\d{2})-(\d{2})/);const date=m?new Date(+m[1],+m[2]-1,+m[3]):new Date(today);
    const res=importScan({date,dept,hosts,rows});runAutomations();S.reg='vuln';S.tab='records';render();
    toast('Отчёт импортирован: новых уязвимостей '+res.added+', уже были в реестре '+res.dup);return;
  }
  const r=reg(S.reg);
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  if(!rows.length){toast('На первом листе нет строк');return}
  const byLabel=Object.fromEntries(r.fields.map(f=>[f.label,f]));
  if(!Object.keys(rows[0]).some(k=>byLabel[k])){toast('Колонки файла не совпадают с полями реестра «'+r.name+'»');return}
  let upd=0,add=0;
  rows.forEach(row=>{
    const rec=row.ID?r.records.find(x=>x.id==row.ID):null,tgt=rec||{id:uid++};let ch=false;
    Object.entries(row).forEach(([k,v])=>{
      const f=byLabel[k];if(!f||f.type==='calc'||f.type==='decision')return;let val;
      if(f.type==='date'){val=v instanceof Date?v:parseRu(v);if(!val)return}
      else if(f.type==='number')val=v===''?'':+v;
      else val=String(v).trim();
      if(f.type==='select'&&val&&!f.options.includes(val))f.options.push(val);
      const old=tgt[f.key];const same=(old instanceof Date&&val instanceof Date)?old.getTime()===val.getTime():String(old??'')===String(val??'');
      if(!same){tgt[f.key]=val;ch=true}
    });
    if(rec){if(ch)upd++}else{r.records.push(tgt);add++}
  });
  runAutomations();S.tab='records';render();toast('Импорт в «'+r.name+'»: обновлено записей '+upd+', добавлено '+add);
}
async function exportReg(id){
  const r=reg(id);
  if(typeof XLSX==='undefined'){toast('Модуль Excel не загрузился, обновите страницу');return}
  if(!r.records.length){toast('В реестре пока нет записей');return}
  const dlf=r.fields.find(f=>f.analytics==='deadline');
  const rows=r.records.map(rec=>{const o={ID:rec.id};r.fields.forEach(f=>{const v=fval(r,rec,f);o[f.label]=v instanceof Date?fmt(v):(v??'');if(f.type==='decision')o[f.label+': документ']=rec[f.key+'Ev']?rec[f.key+'Ev'].doc:''});if(dlf){const v=fval(r,rec,dlf);o['Дней до срока']=v&&!closed(r,rec)?diff(v):''}return o});
  const wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=Object.keys(rows[0]).map(k=>({wch:k==='Краткое описание'?60:Math.max(10,k.length+2)}));
  XLSX.utils.book_append_sheet(wb,ws,'Реестр');
  if(id==='vuln')scans.forEach((s,i)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([[s.report],['№','Имя хоста','IP-адрес','ОС'],...s.hosts.map((h,j)=>[j+1,...h])]),('Хосты '+(i+1)).slice(0,31)));
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  let dl=null;try{dl=await (window.claude&&window.claude.use?window.claude.use('downloads'):null)}catch(_){}
  if(!dl){toast('Сохранение файлов недоступно в этом окне');return}
  try{await dl.save({filename:r.name+' '+fmt(today)+'.xlsx',data:new Uint8Array(buf)});toast('Файл сохранён. ДИКТ заполняет «Статус» и «Комментарий ДИКТ», затем файл импортируется обратно')}
  catch(e){toast(e&&e.code==='declined'?'Сохранение отменено':'Не удалось сохранить файл'+(e&&e.message?': '+e.message:''))}
}

function stageApprovers(doc,i){return i===0?[doc.owner]:usersWithPerm(stagePerms[i]).map(u=>u.name)}
function canAct(doc){if(doc.stage>=routeTpl.length)return false;return doc.stage===0?(me()===doc.owner||hasPerm('docs.manage')):hasPerm(stagePerms[doc.stage])}

}

/* ---------- registers: record card ---------- */
const longRe=/опис|коммент|мер/i;
function recDrawer(r){
  if(S.rec==null)return '';
  const isNew=S.rec==='new',rec=isNew?S.recDraft:r.records.find(x=>x.id===S.rec);if(!rec)return '';
  const dlf=r.fields.find(f=>f.analytics==='deadline');
  const field=f=>{
    const v=rec[f.key],id='re-'+f.key,wide=f.type==='text'&&(f.key==='title'||longRe.test(f.label))||f.type==='decision';
    let ctl;
    if(f.type==='calc'){const cv=fval(r,rec,f);const src=r.fields.find(x=>x.key===f.rule.from),by=r.fields.find(x=>x.key===f.rule.by);
      ctl=`<div class="ro"><b class="mono">${fmt(cv)}</b><small>считается: «${esc(src?src.label:'')}» + срок по «${esc(by?by.label:'')}»${f.rule.override?'; если задан «'+esc((r.fields.find(x=>x.key===f.rule.override)||{}).label||'')+'», берётся он':''}</small></div>`}
    else if(f.type==='decision')ctl=`<div class="ro">${chipFor(v||f.options[0])}${rec[f.key+'Ev']?`<span class="clip">${clipIc}${esc(rec[f.key+'Ev'].file)}</span>`:''}${isNew?'<small>Решение вносится после сохранения записи, с документом ОУР</small>':`<button type="button" class="btn sm" data-decide="${rec.id}">Внести решение ОУР</button>`}</div>`;
    else if(f.type==='select')ctl=selHtml(id,f.options||[],v||'',null,true);
    else if(f.type==='user')ctl=selHtml(id,people,v||'',null,true);
    else if(f.type==='number')ctl=`<input id="${id}" class="inp" type="number" step="any" value="${v??''}">`;
    else if(f.type==='date')ctl=`<input id="${id}" class="inp" type="date" value="${v instanceof Date?isoD(v):''}">`;
    else ctl=longRe.test(f.label)?`<textarea id="${id}" class="inp">${esc(v||'')}</textarea>`:`<input id="${id}" class="inp" value="${esc(v||'')}" ${f.key==='title'?'required':''}>`;
    return `<label class="${wide?'wide':''}">${esc(f.label)}${ctl}</label>`;
  };
  const st=!isNew&&dlf?dlChip(dlState(r,rec),fval(r,rec,dlf)):'';
  const del=!isNew&&hasPerm('records.delete')?(S.recDel?`<div class="danger-zone"><div>Удалить запись без возможности восстановления?</div><div class="row"><button type="button" class="btn sm danger" data-recdelok="1">Удалить</button><button type="button" class="btn sm" data-recdelno="1">Отмена</button></div></div>`:`<button type="button" class="btn sm danger-t" data-recdel="1">Удалить запись</button>`):'';
  return `<div class="backdrop" data-close="1"></div><aside class="drawer wide" role="dialog" aria-label="Запись реестра">
   <div class="dr-h"><div><div class="eyebrow">${esc(r.name)} · ${isNew?'новая запись':'запись #'+rec.id}</div><b style="font-weight:600">${esc(isNew?'Новая запись':rec.title||'Без названия')}</b>${st?`<div style="margin-top:6px">${st}</div>`:''}</div><button class="btn sm" data-close="1">Закрыть</button></div>
   <div class="dr-b">
    <form id="recf" class="recform">${r.fields.map(field).join('')}
     <div class="wide row"><button class="btn primary" type="submit">${isNew?'Создать запись':'Сохранить'}</button><button class="btn" type="button" data-close="1">Отмена</button><span class="hint">Поля формы берутся из конструктора: новое поле реестра сразу появляется здесь.</span></div>
    </form>
    ${del}
    ${!isNew&&rec.history&&rec.history.length?`<div><div class="eyebrow" style="margin-bottom:4px">История изменений</div><div class="hist">${rec.history.slice().reverse().map(h=>`<div>${fmtT(h.at)} · ${esc(h.who)}: ${esc(h.text)}</div>`).join('')}</div></div>`:''}
   </div></aside>`;
}
function readRec(r,rec){
  const ch=[];
  r.fields.forEach(f=>{
    if(f.type==='calc'||f.type==='decision')return;
    const el=document.getElementById('re-'+f.key);if(!el)return;
    let v=el.value;
    if(f.type==='date')v=v?new Date(v+'T00:00'):null;
    else if(f.type==='number')v=v===''?'':+v;
    else v=v.trim();
    const old=rec[f.key];
    const same=(old instanceof Date||v instanceof Date)?((old&&old.getTime())===(v&&v.getTime())):String(old??'')===String(v??'');
    if(!same){ch.push(f);rec[f.key]=v}
  });
  return ch;
}

/* ---------- evidence: card and file preview ---------- */
function fileKind(f){const n=f.name.toLowerCase(),t=f.type||'';if(/\.(png|jpe?g|gif|webp|bmp)$/.test(n)||/^image\//.test(t))return 'img';if(/\.pdf$/.test(n)||t==='application/pdf')return 'pdf';if(/\.(txt|csv|log|json|xml|md|cfg|conf)$/.test(n)||/^text\//.test(t))return 'text';return 'other'}
function fmtSize(b){return b==null?'':b<1024?b+' Б':b<1048576?Math.round(b/1024)+' КБ':(b/1048576).toFixed(1)+' МБ'}
function mkFile(file){return {name:file.name,size:file.size,type:file.type,file,url:URL.createObjectURL(file),at:new Date(),by:me()}}
function evDrawer(){
  const e=evidence.find(x=>x.id===S.ev);if(!e)return '';

function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('не загрузилась библиотека просмотра PDF'));document.head.appendChild(s)})}
let pdfLib=null;
async function getPdf(){
  if(pdfLib)return pdfLib;
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  pdfLib=window.pdfjsLib;return pdfLib;
}
async function fillPreview(){
  const box=document.getElementById('ev-prev');if(!box)return;
  const e=evidence.find(x=>x.id===S.ev);if(!e)return;
  const f=e.files[Math.min(S.evFile||0,e.files.length-1)];if(!f)return;
  const token=box.dataset.t=String(Math.random());
  const k=fileKind(f);
  if(f.demo){box.innerHTML=mockPaper(e,f);return}
  if(k==='img'){box.innerHTML=`<img src="${f.url}" alt="${esc(f.name)}">`;return}
  if(k==='text'){const t=await f.file.slice(0,200000).text();if(box.dataset.t===token)box.innerHTML=`<pre>${esc(t)}</pre>`;return}
  if(k==='pdf'){
    try{
      const lib=await getPdf();const doc=await lib.getDocument({data:new Uint8Array(await f.file.arrayBuffer()),isEvalSupported:false}).promise;
      if(box.dataset.t!==token)return;box.innerHTML='';
      const n=Math.min(doc.numPages,10);
      for(let i=1;i<=n;i++){const p=await doc.getPage(i);const w=(box.clientWidth||480)-2;const v0=p.getViewport({scale:1});const sc=w/v0.width*(window.devicePixelRatio||1);const vp=p.getViewport({scale:sc});
        const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;if(box.dataset.t!==token)return;box.appendChild(c)}
      if(doc.numPages>n)box.insertAdjacentHTML('beforeend',`<div class="hint">Показаны первые ${n} из ${doc.numPages} страниц. Сохраните файл, чтобы открыть весь документ.</div>`);
    }catch(err){if(box.dataset.t===token)box.innerHTML=`<div class="hint">Не удалось показать PDF (${esc(err.message||err)}). Сохраните файл и откройте его на компьютере.</div>`}
    return;
  }
  box.innerHTML=`<div class="hint">Предпросмотр для этого типа файла недоступен. Сохраните файл, чтобы открыть его в программе на компьютере.</div>`;
}

    Object.assign(t,nv);t.due=nd;ch.forEach(c=>t.history.push({at:new Date(),who:me(),text:c}));
    render();toast('Сохранено: '+ch.join('; '));
  }else if(id==='tcf'){
    const t=findTask(S.task),tx=document.getElementById('tc-text').value.trim();if(!tx)return;
    t.comments.push({who:me(),at:new Date(),text:tx});render();toast('Комментарий добавлен');
  }else if(id==='mpf'){
    const raw=document.getElementById('mp-raw').value;
    S.mailDraft={raw,parsed:parseMail(raw),inboxId:S.mailDraft&&S.mailDraft.inboxId};render();
  }else if(id==='mpc'){
    const md=S.mailDraft,p=md.parsed,dv=document.getElementById('mc-due').value;
    const t=normTask({id:uid++,title:document.getElementById('mc-title').value.trim(),source:'Почта',owner:document.getElementById('mc-owner').value,due:dv?new Date(dv+'T00:00'):addWork(3),status:'new',prio:document.getElementById('mc-prio').value,desc:document.getElementById('mc-desc').value,mail:{from:p.from,subj:p.subj,sent:p.sent,body:p.body},history:[{at:new Date(),who:me(),text:'Создана из письма'+(p.from?' от '+p.from:'')}]});
    tasks.push(t);if(md.inboxId){const i=inbox.findIndex(x=>x.id===md.inboxId);if(i>=0)inbox.splice(i,1)}
    S.mailDraft=null;S.task=t.id;render();toast('Задача создана и назначена: '+t.owner);
  }else if(id==='qt'){
    const title=document.getElementById('qt-title').value.trim();const dv=document.getElementById('qt-due').value;
    tasks.push({id:uid++,title,source:document.getElementById('qt-src').value,owner:document.getElementById('qt-owner').value,due:dv?new Date(dv+'T00:00'):d(5),status:'new'});
    render();toast('Задача назначена');
  }
});
function tick(){const c=document.getElementById('clock');if(c){const n=new Date();c.textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')}}
setInterval(tick,1000);
let wake=null;
function keepAwake(){try{if(navigator.wakeLock&&!wake)navigator.wakeLock.request('screen').then(l=>{wake=l;l.addEventListener('release',()=>{wake=null})}).catch(()=>{})}catch(_){}}
setInterval(()=>{
  const t=new Date();t.setHours(0,0,0,0);if(t.getTime()!==today.getTime()){today=t;runAutomations()}
  if(S.view==='monitor')keepAwake();
},12000);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&(S.task||S.mailDraft)){S.task=null;S.mailDraft=null;render();return}
  if(e.key==='Escape'&&S.view==='monitor'){S.view='dash';render();return}
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('.card[data-task]')){S.task=+e.target.dataset.task;render()}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.view==='monitor')keepAwake()});
window.addEventListener('resize',()=>{if(S.view==='monitor')render();else if(S.view==='builder'&&S.tab==='records')layoutRecords()});
if(S.view==='monitor')keepAwake();
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('monitor')});
render();
})();
</script>
<script>
(function(){
  var root=document.documentElement, host=root.getAttribute('data-theme'), seg=document.getElementById('theme-seg');
  function apply(m){
    if(m==='light'||m==='dark')root.setAttribute('data-theme',m);
    else if(host)root.setAttribute('data-theme',host); else root.removeAttribute('data-theme');
    seg.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.th===m))});
  }
  var saved='auto'; try{saved=localStorage.getItem('ib-theme')||'auto'}catch(_){}
  apply(saved);
  seg.addEventListener('click',function(e){var b=e.target.closest('button[data-th]');if(!b)return;apply(b.dataset.th);try{localStorage.setItem('ib-theme',b.dataset.th)}catch(_){}});
})();
</script>
