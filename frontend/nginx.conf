# Сертификат и ключ монтируются из deploy/certs (в git не попадают).

# Ответы API: у выдачи файлов свой CSP от backend (sandbox) — его не дублировать; остальным — строгий.
map $upstream_http_content_security_policy $api_csp {
    ""      "default-src 'none'; frame-ancestors 'none'";
    default "";
}
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/portal.crt;
    ssl_certificate_key /etc/nginx/certs/portal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    server_tokens off;
    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        # С портом: backend сверяет Origin с Host (защита от CSRF), а $host порт отбрасывает —
        # при публикации не на 443 каждый вход отклонялся бы как «неизвестный источник».
        proxy_set_header Host $http_host;
        # Только адрес, с которого пришло соединение: присланный клиентом X-Forwarded-For отбрасывается,
        # иначе любой ПК подставит чужой адрес (вход настенного монитора, журнал аудита). ADR-0012.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        # Свой add_header отменяет заголовки уровня server, поэтому они повторены. nosniff ставит nginx,
        # одинаковый заголовок backend скрывается, иначе в ответе «nosniff, nosniff».
        proxy_hide_header X-Content-Type-Options;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy $api_csp always;
    }

    # Файлы сборки с хэшем в имени кешируются надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
