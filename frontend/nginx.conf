# Сертификат и ключ монтируются из deploy/certs (в git не попадают).

# Ответы API: у выдачи файлов свой CSP от backend (sandbox) — его не дублировать; остальным — строгий.
map $upstream_http_content_security_policy $api_csp {
    ""      "default-src 'none'; frame-ancestors 'none'";
    default "";
}

# Страница портала (SPA): только свои скрипты, стили, шрифты и запросы; pdf.js worker — из /assets.
map $host $page_csp {
    default "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/portal.crt;
    ssl_certificate_key /etc/nginx/certs/portal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    server_tokens off;
    client_max_body_size 25m;

    # Ответы без своего location (ошибки nginx) — с тем же набором.
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy $page_csp always;

    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        # Host — как его прислал браузер, с портом (для журналов backend). Origin backend сверяет с PORTAL_URL, не с Host.
        proxy_set_header Host $http_host;
        # Только адрес, с которого пришло соединение: присланный клиентом X-Forwarded-For отбрасывается,
        # иначе любой ПК подставит чужой адрес (вход настенного монитора, журнал аудита). ADR-0012.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        # nosniff ставит nginx (snippet), одинаковый заголовок backend скрывается, иначе в ответе «nosniff, nosniff».
        proxy_hide_header X-Content-Type-Options;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy $api_csp always;
    }

    # Файлы сборки с хэшем в имени кешируются надолго.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy $page_csp always;
        # Без always: 404 на год не кешируется.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # Страница по другому адресу (IP, другое имя) — на PORTAL_URL (правило: portal-url.sh при старте).
        # /api и /assets не перенаправляются: smoke.sh и проверки ходят на https://localhost.
        if ($portal_redirect) {
            return 301 $portal_redirect$request_uri;
        }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy $page_csp always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
